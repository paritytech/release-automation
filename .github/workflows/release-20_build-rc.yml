name: Release - Build node release candidate

on:
  workflow_dispatch:
    inputs:
      binary:
        description: Binary to be build for the release
        default: all
        type: string
      weekly_release_tag:
        description: Tag matching the actual release candidate with the format polkadot-weeklyYYYw#-rcX or polkadot-weeklyYYYYw#(-X) (e.g. polkadot-weekly2025w1-rc1)
        type: string
  workflow_call:
    inputs:
      binary:
        description: Binary to be build for the release
        default: all
        type: string
      weekly_release_tag:
        description: Tag matching the actual release candidate with the format polkadot-weeklyYYYYw#-rcX or polkadot-weeklyYYYYw#(-X) (e.g. polkadot-weekly2025w1-rc1)
        type: string

jobs:
  validate-inputs:
    runs-on: parity-default
    outputs:
        weekly_release_tag: ${{ steps.validate_inputs.outputs.weekly_release_tag }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0

      - name: Validate inputs
        id: validate_inputs
        run: |
          . ./.github/scripts/common/lib.sh

          RELEASE_TAG=$(validate_weekly_release_tag ${{ inputs.weekly_release_tag }})
          echo "weekly_release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

  build-polkadot-binary:
    needs: [validate-inputs]
    if: ${{ inputs.binary == 'polkadot' || inputs.binary == 'all' }}
    uses: "./.github/workflows/release-reusable-rc-build.yml"
    with:
      binary: '["polkadot", "polkadot-prepare-worker", "polkadot-execute-worker"]'
      package: polkadot
      weekly_release_tag: ${{ needs.validate-inputs.outputs.weekly_release_tag }}
      target: x86_64-unknown-linux-gnu
    # secrets:
    #   PGP_KMS_KEY:  ${{ secrets.PGP_KMS_KEY }}
    #   PGP_KMS_HASH:  ${{ secrets.PGP_KMS_HASH }}
    #   AWS_ACCESS_KEY_ID:  ${{ secrets.AWS_ACCESS_KEY_ID }}
    #   AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    #   AWS_DEFAULT_REGION:  ${{ secrets.AWS_DEFAULT_REGION }}
    #   AWS_RELEASE_ACCESS_KEY_ID: ${{ secrets.AWS_RELEASE_ACCESS_KEY_ID }}
    #   AWS_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.AWS_RELEASE_SECRET_ACCESS_KEY }}
    permissions:
      id-token: write
      attestations: write
      contents: read

  build-polkadot-parachain-binary:
    needs: [validate-inputs]
    if: ${{ inputs.binary == 'polkadot-parachain' || inputs.binary == 'all' }}
    uses: "./.github/workflows/release-reusable-rc-build.yml"
    with:
      binary: '["polkadot-parachain"]'
      package: "polkadot-parachain-bin"
      weekly_release_tag: ${{ needs.validate-inputs.outputs.weekly_release_tag }}
      target: x86_64-unknown-linux-gnu
    # secrets:
    #   PGP_KMS_KEY:  ${{ secrets.PGP_KMS_KEY }}
    #   PGP_KMS_HASH:  ${{ secrets.PGP_KMS_HASH }}
    #   AWS_ACCESS_KEY_ID:  ${{ secrets.AWS_ACCESS_KEY_ID }}
    #   AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    #   AWS_DEFAULT_REGION:  ${{ secrets.AWS_DEFAULT_REGION }}
    #   AWS_RELEASE_ACCESS_KEY_ID: ${{ secrets.AWS_RELEASE_ACCESS_KEY_ID }}
    #   AWS_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.AWS_RELEASE_SECRET_ACCESS_KEY }}
    permissions:
      id-token: write
      attestations: write
      contents: read

