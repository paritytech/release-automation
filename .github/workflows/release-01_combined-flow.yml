name: Weekly Release - Combined release flow

on:
  schedule:
  #   # Run every Wednesday at 8:00 PM UTC
    - cron: '00 20 * * 3'
  workflow_dispatch:
    inputs:
      weekly_version:
        description: The version of the weekly release in the format weeklyYYYYw# that will be used as branch name and rc tag base (e.g. weekly2025w1)
        required: true
        type: string

      node_version:
        description: Version of the polkadot node in the format X.XX.X-weeklyYYYYw# (e.g. 1.15.0-weekly2025w1).
        required: true
        type: string

      is_new_weekly:
        description: ⚠️ Check this box if this is a new weekly release and the weekly release branch needs to be created
        type: boolean

      binary:
        description: Binary to be build for the release
        default: all
        required: true
        type: choice
        options:
          - all
          - polkadot
          - polkadot-parachain
          - polkadot-omni-node
          - frame-omni-bencher
          - chain-spec-builder
          - substrate-node
          - eth-rpc
          - subkey

      chain:
        description: The chain to use
        default: all
        required: true
        type: choice
        options:
          - all
          - westend
          - asset-hub-westend
          - bridge-hub-westend
          - collectives-westend
          - coretime-westend
          - glutton-westend
          - people-westend

      runtime_dir:
        description: The runtime dir to be used (⚠️ this parameter is optional and needed only in case of the single runtime build, set it accordingly to the runtime you want to build)
        type: choice
        options:
          - polkadot/runtime/westend
          - cumulus/parachains/runtimes/assets/asset-hub-westend
          - cumulus/parachains/runtimes/bridge-hubs/bridge-hub-westend
          - cumulus/parachains/runtimes/collectives/collectives-westend
          - cumulus/parachains/runtimes/coretime/coretime-westend
          - cumulus/parachains/runtimes/glutton/glutton-westend
          - cumulus/parachains/runtimes/people/people-westend

jobs:
  calculate-weekly-version:
    runs-on: parity-default
    outputs:
      weekly_version: ${{ steps.calculate_weekly.outputs.weekly_version }}
      node_version: ${{ steps.calculate_weekly.outputs.node_version }}
      binary: ${{ steps.calculate_weekly.outputs.binary }}
      chain: ${{ steps.calculate_weekly.outputs.chain }}
      runtime_dir: ${{ steps.calculate_weekly.outputs.runtime_dir }}
      is_new_weekly: ${{ steps.calculate_weekly.outputs.is_new_weekly }}

    steps:
      - name: Checkout release-automation scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Calculate weekly version and set defaults
        id: calculate_weekly
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BINARY: ${{ inputs.binary }}
          INPUT_CHAIN: ${{ inputs.chain }}
          INPUT_RUNTIME_DIR: ${{ inputs.runtime_dir }}
          INPUT_IS_NEW_WEEKLY: ${{ inputs.is_new_weekly }}
        run: |
          . ./.github/scripts/pipeline-lib.sh

          weekly_version=$(get_current_weekly_version)

          # Generate node version (using a placeholder version number)
          latest_node_version=$(docker run --rm parity/polkadot:latest --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          patched_node_version=$(echo "$latest_node_version" | awk -F. '{print $1"."$2"."$3+1}')
          node_version="${patched_node_version}-${weekly_version}"

          # Set default values for cron triggers
          if [ "$EVENT_NAME" = "schedule" ]; then
            binary="all"
            chain="all"
            is_new_weekly="true"
          else
            # For manual triggers, use input values
            binary="$INPUT_BINARY"
            chain="$INPUT_CHAIN"
            runtime_dir="$INPUT_RUNTIME_DIR"
            is_new_weekly="$INPUT_IS_NEW_WEEKLY"
          fi

          echo "weekly_version=${weekly_version}" >> $GITHUB_OUTPUT
          echo "node_version=${node_version}" >> $GITHUB_OUTPUT
          echo "binary=${binary}" >> $GITHUB_OUTPUT
          echo "chain=${chain}" >> $GITHUB_OUTPUT
          echo "runtime_dir=${runtime_dir}" >> $GITHUB_OUTPUT
          echo "is_new_weekly=${is_new_weekly}" >> $GITHUB_OUTPUT

          echo "Generated weekly version: ${weekly_version}"
          echo "Generated node version: ${node_version}"
          echo "Binary: ${binary}"
          echo "Chain: ${chain}"
          echo "Runtime dir: ${runtime_dir}"
          echo "Is new weekly: ${is_new_weekly}"

  validate-inputs:
    runs-on: parity-default
    needs: [calculate-weekly-version]
    outputs:
      node_version: ${{ steps.validate_inputs.outputs.node_version }}
      weekly_version: ${{ steps.validate_inputs.outputs.weekly_version }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate inputs
        id: validate_inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CALC_WEEKLY_VERSION: ${{ needs.calculate-weekly-version.outputs.weekly_version }}
          CALC_NODE_VERSION: ${{ needs.calculate-weekly-version.outputs.node_version }}
          INPUT_NODE_VERSION: ${{ inputs.node_version }}
          INPUT_WEEKLY_VERSION: ${{ inputs.weekly_version }}
        run: |
          . ./.github/scripts/pipeline-lib.sh

          # Use calculated values for cron triggers, or input values for manual triggers
          if [ "$EVENT_NAME" = "schedule" ]; then
            # For cron triggers, use calculated values
            weekly_version=$(validate_weekly_release_tag "$CALC_WEEKLY_VERSION")
            node_version="$CALC_NODE_VERSION"
          else
            # For manual triggers, use input values
            if [ -n "$INPUT_NODE_VERSION" ]; then
              node_version=$(filter_version_from_input "$INPUT_NODE_VERSION")
            fi
            weekly_version=$(validate_weekly_release_tag "$INPUT_WEEKLY_VERSION")
          fi

          echo "weekly_version=${weekly_version}" >> $GITHUB_OUTPUT
          echo "node_version=${node_version}" >> $GITHUB_OUTPUT

  create-or-update-weekly-branch:
    needs: [ validate-inputs, calculate-weekly-version ]
    uses: ./.github/workflows/release-10_branchoff-weekly.yml
    with:
      weekly_version: ${{ needs.validate-inputs.outputs.weekly_version }}
      node_version: ${{ needs.validate-inputs.outputs.node_version }}
      is_new_weekly: ${{ needs.calculate-weekly-version.outputs.is_new_weekly == 'true' }}
    secrets: inherit

  tag-weekly-rc:
    needs: [ validate-inputs, create-or-update-weekly-branch ]
    uses: ./.github/workflows/release-11_rc-automation.yml
    with:
      weekly_version: ${{ needs.validate-inputs.outputs.weekly_version }}
    secrets: inherit

  build-weekly-rc:
    needs: [ tag-weekly-rc, calculate-weekly-version ]
    uses: ./.github/workflows/release-20_build-rc.yml
    with:
      binary: ${{ needs.calculate-weekly-version.outputs.binary }}
      weekly_release_tag: ${{ needs.tag-weekly-rc.outputs.rc_tag }}
    permissions:
      id-token: write
      attestations: write
      contents: read

  build-runtimes:
    needs: [ tag-weekly-rc, calculate-weekly-version ]
    uses: ./.github/workflows/release-21_build-runtimes.yml
    with:
      chain: ${{ needs.calculate-weekly-version.outputs.chain }}
      runtime_dir: ${{ needs.calculate-weekly-version.outputs.runtime_dir }}
      weekly_release_tag: ${{ needs.tag-weekly-rc.outputs.rc_tag }}
    permissions:
      contents: read

  build-weekly-rc-docker-images:
    needs: [ validate-inputs, calculate-weekly-version, tag-weekly-rc, build-weekly-rc ]
    uses: ./.github/workflows/release-50_publish-docker.yml
    with:
      binary: ${{ needs.calculate-weekly-version.outputs.binary }}
      weekly_release_tag: ${{ needs.tag-weekly-rc.outputs.rc_tag }}
      registry: docker.io
      owner: paritypr
      version: ${{ needs.validate-inputs.outputs.node_version }}
      build_run_id: ${{ github.run_id }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      actions: read

  # The e2e gate wants polkadot and its two PVF workers side by side in ONE artifact
  # (the engine copies the workers from the directory polkadot sits in), while the
  # build stage uploads one artifact per binary. Collect the linux x86_64 node
  # binaries Westend runs on into a single artifact for the gate.
  bundle-e2e-binaries:
    needs: [ calculate-weekly-version, build-weekly-rc ]
    # Same condition as e2e-gate, its only consumer.
    if: ${{ needs.calculate-weekly-version.outputs.binary == 'all' && needs.calculate-weekly-version.outputs.chain == 'all' }}
    runs-on: parity-default
    # Part of the advisory e2e stage: a failure here must not turn the run red.
    # continue-on-error makes this job report success to `needs` even when it failed,
    # so e2e-gate keys on the `ready` output instead and is skipped without a bundle.
    # release-99_notify-failure.yml reports the failure.
    continue-on-error: true
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    permissions:
      contents: read
    steps:
      - name: Download node binaries
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: "{polkadot,polkadot-prepare-worker,polkadot-execute-worker,polkadot-parachain}_x86_64-unknown-linux-gnu"
          path: e2e-node-binaries
          merge-multiple: true

      - name: Check the bundle is complete
        working-directory: e2e-node-binaries
        run: |
          ls -la
          for binary in polkadot polkadot-prepare-worker polkadot-execute-worker polkadot-parachain; do
            if [ ! -f "$binary" ]; then
              echo "::error::$binary is missing from the e2e bundle"
              exit 1
            fi
          done

      - name: Upload the bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # 6.0.0
        with:
          name: e2e-node-binaries
          path: e2e-node-binaries
          retention-days: 7

      - name: Mark the bundle as ready
        id: ready
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  # Forks live Westend (relay, Asset Hub, People), spawns it on the node binaries built
  # in this run, upgrades the three chains to the runtimes built in this run and runs
  # the chain tests against the result.
  #
  # ADVISORY for now, in two ways:
  #   * `advisory: true` — the gate's jobs fail visibly, but this job reports success
  #     and the run stays green. release-99_notify-failure.yml reads the run's jobs
  #     and posts gate failures to the release channel.
  #   * nothing `needs` this job — it runs next to the draft and publish stages, so a
  #     slow or hung fork cannot delay the release.
  # To make the gate blocking, drop `advisory` and add this job to
  # publish-release-draft's `needs` (with an `if` that still lets partial runs, where
  # the gate is skipped, through).
  #
  # Only full runs are gated: a single-binary or single-chain rebuild does not produce
  # everything the fork needs.
  e2e-gate:
    needs: [ calculate-weekly-version, bundle-e2e-binaries, build-runtimes ]
    if: >-
      ${{ needs.calculate-weekly-version.outputs.binary == 'all'
          && needs.calculate-weekly-version.outputs.chain == 'all'
          && needs.bundle-e2e-binaries.outputs.ready == 'true' }}
    # The called workflow inherits this token. It only reads this run's artifacts and
    # public releases, so it gets nothing else — and no secrets.
    permissions:
      contents: read
    # Pinned to a commit so a change to the gate's inputs or a broken workflow file
    # upstream cannot fail this whole workflow at startup. Only the workflow FILE is
    # pinned: the gate checks out its code and network manifests from `gate_ref`
    # (default: its main branch), so the manifests keep tracking what live Westend runs.
    #
    # Bump the pin when the gate's workflow file changes upstream: the file pinned here
    # drives scripts taken from main, and the two can drift apart.
    uses: paritytech/polkadot-pop-e2e/.github/workflows/release-gate.yml@e1cf64d0376d8a97e02ed0d1bef47d361c5a7f37 # main, 2026-11-16
    with:
      advisory: true
      environment: westend
      binary_polkadot: "artifact:e2e-node-binaries"
      binary_polkadot_parachain: "artifact:e2e-node-binaries"
      # srtool uploads one `<chain>-runtime` artifact per runtime. The glob collects
      # them all and the gate picks each chain's wasm by the spec_name it declares.
      runtime_relay: "artifact:*-runtime"
      runtime_asset_hub: "artifact:*-runtime"
      runtime_people: "artifact:*-runtime"
      runs_on: parity-large

  publish-release-draft:
    needs: [ tag-weekly-rc, build-weekly-rc, build-runtimes ]
    uses: ./.github/workflows/release-30_publish_release_draft.yml
    with:
      weekly_release_tag: ${{ needs.tag-weekly-rc.outputs.rc_tag }}
      build_run_id: ${{ github.run_id }}
      runtimes: '${{ needs.build-runtimes.outputs.published_runtimes }}'
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      actions: read

  publish-release:
    needs: [ tag-weekly-rc, publish-release-draft ]
    runs-on: parity-default
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_TAG: ${{ needs.tag-weekly-rc.outputs.rc_tag }}
          REPO: ${{ github.repository }}
        run: |
          sudo apt-get update && sudo apt-get install -y gh

          gh release edit "$RC_TAG" \
            --repo "$REPO" \
            --draft=false
