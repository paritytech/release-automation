name: Release - Combined release flow

on:
  # schedule:
  #   # Run every Wednesday at 9:00 PM UTC
  #   - cron: '25 12 * * *'
  workflow_dispatch:
    inputs:
      weekly_version:
        description: The version of the weekly release in the format weeklyYYYYw# that will be used as branch name and rc tag base (e.g. weekly2025w1)
        required: true
        type: string

      node_version:
        description: Version of the polkadot node in the format X.XX.X-weeklyYYYYw# (e.g. 1.15.0-weekly2025w1).
        required: true
        type: string

      is_new_weekly:
        description: ⚠️ Check this box if this is a new weekly release and the weekly release branch needs to be created
        type: boolean

      binary:
        description: Binary to be build for the release
        default: all
        required: true
        type: choice
        options:
          - all
          - polkadot
          - polkadot-parachain
          # - polkadot-omni-node
          # - frame-omni-bencher
          # - chain-spec-builder

      chain:
        description: The chain to use
        default: all
        required: true
        type: choice
        options:
          - all
          - westend
          - asset-hub-westend
          - bridge-hub-westend
          - collectives-westend
          - coretime-westend
          - glutton-westend
          - people-westend

      runtime_dir:
        description: The runtime dir to be used (⚠️ this parameter is optional and needed only in case of the single runtime build, set it accordingly to the runtime you want to build)
        type: choice
        options:
          - polkadot/runtime/westend
          - cumulus/parachains/runtimes/assets/asset-hub-westend
          - cumulus/parachains/runtimes/bridge-hubs/bridge-hub-westend
          - cumulus/parachains/runtimes/collectives/collectives-westend
          - cumulus/parachains/runtimes/coretime/coretime-westend
          - cumulus/parachains/runtimes/glutton/glutton-westend
          - cumulus/parachains/runtimes/people/people-westend

jobs:
  calculate-weekly-version:
    runs-on: parity-default
    outputs:
      weekly_version: ${{ steps.calculate_weekly.outputs.weekly_version }}
      node_version: ${{ steps.calculate_weekly.outputs.node_version }}
      binary: ${{ steps.calculate_weekly.outputs.binary }}
      chain: ${{ steps.calculate_weekly.outputs.chain }}
      runtime_dir: ${{ steps.calculate_weekly.outputs.runtime_dir }}
      is_new_weekly: ${{ steps.calculate_weekly.outputs.is_new_weekly }}

    steps:
      - name: Calculate weekly version and set defaults
        id: calculate_weekly
        run: |
          # Get current year and week number
          current_year=$(date +%Y)
          current_week=$(date +%V)

          # Generate weekly version in format weeklyYYYYw#
          weekly_version="weekly${current_year}w${current_week}"

          # Generate node version (using a placeholder version number)
          latest_node_version=$(docker run --rm parity/polkadot:latest --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          node_version="${latest_node_version}-${weekly_version}"

          # Set default values for cron triggers
          if [ "${{ github.event_name }}" = "schedule" ]; then
            binary="all"
            chain="all"
            is_new_weekly="true"
          else
            # For manual triggers, use input values
            binary="${{ inputs.binary }}"
            chain="${{ inputs.chain }}"
            runtime_dir="${{ inputs.runtime_dir }}"
            is_new_weekly="${{ inputs.is_new_weekly }}"
          fi

          echo "weekly_version=${weekly_version}" >> $GITHUB_OUTPUT
          echo "node_version=${node_version}" >> $GITHUB_OUTPUT
          echo "binary=${binary}" >> $GITHUB_OUTPUT
          echo "chain=${chain}" >> $GITHUB_OUTPUT
          echo "runtime_dir=${runtime_dir}" >> $GITHUB_OUTPUT
          echo "is_new_weekly=${is_new_weekly}" >> $GITHUB_OUTPUT

          echo "Generated weekly version: ${weekly_version}"
          echo "Generated node version: ${node_version}"
          echo "Binary: ${binary}"
          echo "Chain: ${chain}"
          echo "Runtime dir: ${runtime_dir}"
          echo "Is new weekly: ${is_new_weekly}"

  validate-inputs:
    runs-on: parity-default
    needs: [calculate-weekly-version]
    outputs:
      node_version: ${{ steps.validate_inputs.outputs.node_version }}
      weekly_version: ${{ steps.validate_inputs.outputs.weekly_version }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@6d193bf28034eafb982f37bd894289fe649468fc # v4.1.7

      - name: Validate inputs
        id: validate_inputs
        run: |
          . ./.github/scripts/common/lib.sh

          # Use calculated values for cron triggers, or input values for manual triggers
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # For cron triggers, use calculated values
            weekly_version=$(validate_weekly_release_tag ${{ needs.calculate-weekly-version.outputs.weekly_version }})
            node_version="${{ needs.calculate-weekly-version.outputs.node_version }}"
          else
            # For manual triggers, use input values
            if [ -n "${{ inputs.node_version }}" ]; then
              node_version=$(filter_version_from_input "${{ inputs.node_version }}")
            fi
            weekly_version=$(validate_weekly_release_tag ${{ inputs.weekly_version }})
          fi

          echo "weekly_version=${weekly_version}" >> $GITHUB_OUTPUT
          echo "node_version=${node_version}" >> $GITHUB_OUTPUT

  create-or-update-weekly-branch:
    needs: [ validate-inputs, calculate-weekly-version ]
    uses: ./.github/workflows/release-10_branchoff-weekly.yml
    with:
      weekly_version: ${{ needs.validate-inputs.outputs.weekly_version }}
      node_version: ${{ needs.validate-inputs.outputs.node_version }}
      is_new_weekly: ${{ needs.calculate-weekly-version.outputs.is_new_weekly == 'true' }}
    secrets: inherit
  tag-weekly-rc:
    needs: [ validate-inputs, create-or-update-weekly-branch ]
    uses: ./.github/workflows/release-11_rc-automation.yml
    with:
      weekly_version: ${{ needs.validate-inputs.outputs.weekly_version }}
    secrets: inherit

  build-weekly-rc:
    needs: [ tag-weekly-rc, calculate-weekly-version ]
    uses: ./.github/workflows/release-20_build-rc.yml
    with:
      binary: ${{ needs.calculate-weekly-version.outputs.binary }}
      weekly_release_tag: ${{ needs.tag-weekly-rc.outputs.rc_tag }}
    permissions:
      id-token: write
      attestations: write
      contents: read

  build-runtimes:
    needs: [ tag-weekly-rc, calculate-weekly-version ]
    uses: ./.github/workflows/release-21_build-runtimes.yml
    with:
      chain: ${{ needs.calculate-weekly-version.outputs.chain }}
      runtime_dir: ${{ needs.calculate-weekly-version.outputs.runtime_dir }}
      weekly_release_tag: ${{ needs.tag-weekly-rc.outputs.rc_tag }}
    permissions:
      id-token: write
      attestations: write
      contents: read

  build-weekly-rc-docker-images:
    needs: [ validate-inputs, calculate-weekly-version, tag-weekly-rc, build-weekly-rc ]
    uses: ./.github/workflows/release-50_publish-docker.yml
    with:
      binary: ${{ needs.calculate-weekly-version.outputs.binary }}
      weekly_release_tag: ${{ needs.tag-weekly-rc.outputs.rc_tag }}
      registry: docker.io
      owner: parity
      version: ${{ needs.validate-inputs.outputs.node_version }}
      build_run_id: ${{ github.run_id }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      actions: read
