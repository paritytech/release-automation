# Publishes the crates of a release from the commit of its rc tag.
#
# The versions were planned and committed beforehand by release-stable-15, and the rc
# tagged on that commit has been built and gated by release-stable-22. This workflow
# only rewrites the manifests for the registry in its own checkout and publishes:
# nothing is committed and nothing is pushed. The published sources are those of the
# rc commit, which is also the commit the final tag is put on.
#
# The one thing it writes to polkadot-sdk is the publish record: the commit status
# `release/crates-published` on the rc commit (`release/crates-published-staging`
# for staging.crates.io), `pending` when the publish starts, then `success` or
# `failure`. release-stable-15 reads it to know which plan is published. A dry run
# records nothing.
#
# A run that fails or is cancelled can be started again with the same tag: versions
# that are already on crates.io are skipped. staging.crates.io differs, because
# parity-publish looks for existing versions on crates.io only. There a second run
# needs `publish_jobs`: the parallel mode passes over a crate the registry refuses
# as already uploaded, the sequential one stops at it.
name: Stable Release - Publish Crates

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the rc being released, e.g. polkadot-stable2509-3-rc2 or polkadot-unstable2604-rc1. The crates are published from its commit.'
        required: true
        type: string
      registry:
        description: 'Registry to publish crates to'
        required: true
        type: choice
        options:
          - staging.crates.io
          - crates.io
        default: staging.crates.io
      dry_run:
        description: 'Dry run - do not actually publish crates'
        required: true
        type: boolean
        default: true
      skip_e2e_gate:
        description: Publish to crates.io without a passing e2e gate verdict on this rc. Only for releases the gate cannot test (older stable lines, crates-only releases)
        required: false
        default: false
        type: boolean
      publish_jobs:
        description: 'Number of parallel publish jobs (0 = sequential publishing, >0 = parallel with N jobs).'
        required: false
        type: string
        default: '0'
      clean_every:
        description: 'Run cargo clean after every N published crates to free disk space (0 = disabled). Recommend 50 for major releases with 100+ crates, otherwise the job may fail due to disk space.'
        required: false
        type: string
        default: '0'
      publish_delay:
        description: 'Delay in seconds between parallel publish batches to avoid crates.io rate limits. Only applies when publish_jobs > 0. (0 = no delay, preserves existing behavior)'
        required: false
        type: string
        default: '0'

# No repository content is written. The publish record is posted with an App token.
permissions:
  contents: read

# Two runs for the same rc would publish the same crates against each other and
# write the publish record in turns.
concurrency:
  group: release-stable-80-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  # Verifies the tag and pins it to a commit. Publishing to crates.io for real also
  # needs the e2e gate verdict on that commit; staging and dry runs do not.
  guard:
    uses: ./.github/workflows/release-guard.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      require_e2e_gate: ${{ inputs.registry == 'crates.io' && !inputs.dry_run }}
      skip_e2e_gate: ${{ inputs.skip_e2e_gate }}

  # The build image comes from the commit being published.
  set-image:
    needs: [ guard ]
    runs-on: ubuntu-latest
    outputs:
      IMAGE: ${{ steps.set_image.outputs.IMAGE }}
    steps:
      - name: Assert the guard ran
        shell: bash
        env:
          GUARD_SHA: ${{ needs.guard.outputs.sha }}
        run: '[[ "$GUARD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No verified SHA from the release guard"; exit 1; }'

      - name: Checkout polkadot-sdk at the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paritytech/polkadot-sdk
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false

      - id: set_image
        run: cat .github/env >> "$GITHUB_OUTPUT"

  # Checks that the commit can be published from, then opens the publish record.
  # Nothing from the checkout is run here: only git data is read. It waits for
  # set-image so that the record is opened as late as possible: a run that fails
  # after this job counts as a publish that did not complete.
  start-publish:
    needs: [ guard, set-image ]
    runs-on: ubuntu-latest
    # The App key is a secret of this environment.
    environment: release
    outputs:
      context: ${{ steps.context.outputs.context }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Assert the guard ran
        env:
          GUARD_SHA: ${{ needs.guard.outputs.sha }}
        run: '[[ "$GUARD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No verified SHA from the release guard"; exit 1; }'

      # Plan.toml, the history and the tags of the line are all this job reads.
      - name: Checkout polkadot-sdk at the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paritytech/polkadot-sdk
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: Plan.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # release-automation at the commit of this run, next to the tree it inspects.
      - name: Checkout the publish record helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release-automation
          sparse-checkout: .github/scripts/crates
          persist-credentials: false

      # The commit must be one that release-stable-15 prepared, after the last
      # change that needs a crate release.
      - name: Check the commit was prepared for a crates release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ -z "$(git ls-tree --name-only HEAD -- Plan.toml)" ]]; then
            echo "::error title=Commit not prepared::${RELEASE_TAG} has no Plan.toml. Run release-stable-15, merge its pull request and tag a new rc."
            exit 1
          fi

          # release-stable-15 moves every prdoc into the release folder. One left at
          # top level was merged after its last run, so the crates it changes are
          # not in the plan: they would silently stay unpublished while the binaries
          # of this rc already contain the change.
          unprepared=$(git ls-tree --name-only HEAD prdoc/ | grep -E '^prdoc/pr_[^/]*\.prdoc$' || true)
          if [[ -n "$unprepared" ]]; then
            echo "::error title=Commit not prepared::${RELEASE_TAG} has $(grep -c . <<<"$unprepared") prdoc(s) that were merged after the last run of release-stable-15: $(tr '\n' ' ' <<<"$unprepared"). Run release-stable-15 again, merge its pull request and tag a new rc."
            exit 1
          fi
          echo "Plan.toml is present and no prdoc is waiting to be planned"

      # release-stable-15 picked the versions before this rc was built and gated. If
      # another release line published one of them since, parity-publish would take
      # it for already published and skip the crate without a word. It decides that
      # from crates.io, also when uploading to staging, so crates.io is what is read.
      - name: Check that the planned versions are still free
        env:
          GH_TOKEN: ${{ github.token }}
          # Numeric user id of the release App's bot: only its records count.
          RELEASE_AUTOMATION_APP_BOT_ID: ${{ vars.RELEASE_AUTOMATION_APP_BOT_ID }}
          GUARD_SHA: ${{ needs.guard.outputs.sha }}
          STABLE_BRANCH: ${{ needs.guard.outputs.stable_branch }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          . release-automation/.github/scripts/crates/publish-record.sh

          check_versions_free "$STABLE_BRANCH" "$GUARD_SHA" "$REGISTRY"

      - name: Name the publish record
        id: context
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          . release-automation/.github/scripts/crates/publish-record.sh

          echo "context=$(publish_context "$REGISTRY")" >> "$GITHUB_OUTPUT"

      - name: Generate a commit status token for polkadot-sdk
        if: ${{ !inputs.dry_run }}
        id: status_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: paritytech
          repositories: polkadot-sdk
          permission-statuses: write

      # Last step on purpose: from here on release-stable-15 treats this commit as
      # one whose publish has started.
      - name: Open the publish record
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.status_token.outputs.token }}
          GUARD_SHA: ${{ needs.guard.outputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REGISTRY: ${{ inputs.registry }}
          CONTEXT: ${{ steps.context.outputs.context }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/paritytech/polkadot-sdk/statuses/${GUARD_SHA}" \
            -f state=pending \
            -f context="$CONTEXT" \
            -f description="Publishing the crates of ${RELEASE_TAG} to ${REGISTRY}" \
            -f target_url="$RUN_URL" \
            --jq '"status \(.state) posted on \(.url)"'

  publish-crates:
    needs: [ guard, set-image, start-publish ]
    runs-on: parity-large
    environment: release
    container:
      image: ${{ needs.set-image.outputs.IMAGE }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Assert the guard ran
        env:
          GUARD_SHA: ${{ needs.guard.outputs.sha }}
        run: '[[ "$GUARD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No verified SHA from the release guard"; exit 1; }'

      - name: Checkout polkadot-sdk at the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paritytech/polkadot-sdk
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false

      # cargo records the commit it packages from; without this it cannot read the
      # repository inside the container.
      - name: Configure git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install parity-publish
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config
          cargo install parity-publish@0.10.17 --locked -q

      # From here on the checkout is modified and never committed: the manifests get
      # the planned versions and registry dependencies, exactly as release-stable-15
      # validated them.
      - name: Rewrite the manifests for the registry
        run: |
          echo "Running parity-publish apply..."
          parity-publish apply
          echo "Updating Cargo.lock..."
          cargo update --workspace --offline || cargo update --workspace

      # Parallel publishing does not verify each crate, so check the workspace once.
      - name: Verify workspace compiles
        if: inputs.publish_jobs > 0
        env:
          SKIP_WASM_BUILD: 1
        run: |
          echo "Checking that rewritten manifests compile (WASM build skipped)..."
          cargo check --workspace --all-targets 2>&1
          echo "Workspace compiles successfully"

      - name: Configure cargo registry
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          echo "Configuring cargo for $REGISTRY..."
          mkdir -p ~/.cargo

          if [ "$REGISTRY" = "staging.crates.io" ]; then
            cat >> ~/.cargo/config.toml << 'EOF'
          [registries.staging]
          index = "sparse+https://index.staging.crates.io/"
          EOF
          else
            echo "Using default crates.io registry"
          fi

          echo "Cargo config:"
          cat ~/.cargo/config.toml || echo "(using defaults)"

      # --allow-dirty: the manifests were rewritten above and are not committed.
      # cargo still records the rc commit in each crate's .cargo_vcs_info.json.
      - name: Publish crates
        env:
          PARITY_PUBLISH_CRATESIO_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
          PARITY_PUBLISH_STAGING_CRATESIO_TOKEN: ${{ secrets.STAGING_CRATES_IO_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGISTRY: ${{ inputs.registry }}
          PUBLISH_JOBS: ${{ inputs.publish_jobs }}
          CLEAN_EVERY: ${{ inputs.clean_every }}
          PUBLISH_DELAY: ${{ inputs.publish_delay }}
        run: |
          PARALLEL_ARGS=""
          if [ "$PUBLISH_JOBS" -gt 0 ] 2>/dev/null; then
            echo "Parallel publishing enabled with $PUBLISH_JOBS jobs"
            PARALLEL_ARGS="-j $PUBLISH_JOBS --no-verify"
          fi

          CLEAN_ARGS=""
          if [ "$CLEAN_EVERY" -gt 0 ] 2>/dev/null; then
            echo "Disk cleanup enabled: cargo clean every $CLEAN_EVERY crates"
            CLEAN_ARGS="--clean-every $CLEAN_EVERY"
          fi

          DELAY_ARGS=""
          if [ "$PUBLISH_DELAY" -gt 0 ] 2>/dev/null; then
            echo "Publish delay enabled: ${PUBLISH_DELAY}s between parallel batches"
            DELAY_ARGS="--publish-delay $PUBLISH_DELAY"
          fi

          STAGING_ARG=""
          if [ "$REGISTRY" = "staging.crates.io" ]; then
            STAGING_ARG="--staging"
          fi

          DRY_RUN_ARG=""
          if [ "$DRY_RUN" = true ]; then
            echo "DRY RUN - Not actually publishing crates"
            DRY_RUN_ARG="-d"
          fi

          echo "Target registry: $REGISTRY"
          parity-publish apply -p --allow-dirty $DRY_RUN_ARG $STAGING_ARG $PARALLEL_ARGS $CLEAN_ARGS $DELAY_ARGS 2>&1 | tee /tmp/publish.log

          if [ "$DRY_RUN" != true ]; then
            echo "Crates published successfully to $REGISTRY!"
          fi

      - name: Summarize
        if: always()
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GUARD_SHA: ${{ needs.guard.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          {
            echo "### Crates publish for \`${RELEASE_TAG}\`"
            echo
            echo "- Commit: \`${GUARD_SHA}\`"
            echo "- Registry: ${REGISTRY}, dry run: ${DRY_RUN}"
            # parity-publish prints how many crates it publishes and how many it
            # skips because their version is already on the registry.
            if summary=$(grep -m1 -E '^Publishing [0-9]+ (packages|crates)' /tmp/publish.log 2>/dev/null); then
              echo "- ${summary}"
            else
              echo "- Publishing did not start"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify RelEng on failure or cancellation
        if: failure() || cancelled()
        uses: s3krit/matrix-message-action@70ad3fb812ee0e45ff8999d6af11cafad11a6ecf # v0.0.3
        with:
          room_id: '!GvAyzgCDgaVrvibaAF:parity.io'
          access_token: ${{ secrets.RELEASENOTES_MATRIX_V2_ACCESS_TOKEN }}
          server: m.parity.io
          message: |
            **Publish Crates workflow did not complete** for `${{ inputs.release_tag }}` (registry: `${{ inputs.registry }}`, dry_run: `${{ inputs.dry_run }}`).<br/>
            Likely causes: the 6h GitHub job timeout, or an error during publishing.<br/>
            Run the workflow again with the same tag: crates that are already on crates.io are skipped. On staging.crates.io set `publish_jobs` for the second run.<br/>
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Closes the publish record. Runs whenever it was opened, so a cancelled run or
  # a failed job does not leave the commit pending: anything but a completed
  # publish is recorded as a failure, which release-stable-15 reads as "finish
  # this publish first".
  record-publish:
    needs: [ guard, start-publish, publish-crates ]
    if: ${{ always() && !inputs.dry_run && needs.start-publish.result == 'success' }}
    runs-on: ubuntu-latest
    # The App key is a secret of this environment.
    environment: release
    permissions: {}
    steps:
      - name: Assert the guard ran
        env:
          GUARD_SHA: ${{ needs.guard.outputs.sha }}
        run: '[[ "$GUARD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No verified SHA from the release guard"; exit 1; }'

      - name: Generate a commit status token for polkadot-sdk
        id: status_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: paritytech
          repositories: polkadot-sdk
          permission-statuses: write

      - name: Record how the publish ended
        env:
          GH_TOKEN: ${{ steps.status_token.outputs.token }}
          GUARD_SHA: ${{ needs.guard.outputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REGISTRY: ${{ inputs.registry }}
          CONTEXT: ${{ needs.start-publish.outputs.context }}
          PUBLISH_RESULT: ${{ needs.publish-crates.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$PUBLISH_RESULT" == "success" ]]; then
            state=success
            description="Crates of ${RELEASE_TAG} are published to ${REGISTRY}"
          else
            state=failure
            description="Crates publish of ${RELEASE_TAG} to ${REGISTRY} did not complete (${PUBLISH_RESULT})"
          fi

          gh api --method POST "repos/paritytech/polkadot-sdk/statuses/${GUARD_SHA}" \
            -f state="$state" \
            -f context="$CONTEXT" \
            -f description="$description" \
            -f target_url="$RUN_URL" \
            --jq '"status \(.state) posted on \(.url)"'

          {
            echo "### Publish record: ${state}"
            echo
            echo "${description}. Recorded as \`${CONTEXT}\` on \`${GUARD_SHA}\` in paritytech/polkadot-sdk."
          } >> "$GITHUB_STEP_SUMMARY"
