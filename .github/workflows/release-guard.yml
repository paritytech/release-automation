# Gate for every stable release workflow that builds, signs or publishes
# artifacts. It accepts stable tags only; the weekly pipeline is not covered.
#
# Replaces paritytech-release/sync-workflows/.../check-synchronization.yml@main.

# Call it only as a local reusable workflow from release-automation, as the
# first job, and take every downstream `actions/checkout` ref from its `sha`
# output rather than from the tag name. Every consuming job must assert the SHA
# before checking out:
#
#   jobs:
#     guard:
#       uses: ./.github/workflows/release-guard.yml
#       with:
#         release_tag: ${{ inputs.release_tag }}
#
#     build:
#       needs: [guard]
#       steps:
#         - name: Assert the guard ran
#           env:
#             GUARD_SHA: ${{ needs.guard.outputs.sha }}
#           run: '[[ "$GUARD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No verified SHA from the release guard"; exit 1; }'
#
#         - uses: actions/checkout@...
#           with:
#             repository: paritytech/polkadot-sdk
#             ref: ${{ needs.guard.outputs.sha }}   # never inputs.release_tag
#

name: Release - Guard

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to verify, e.g. polkadot-stable2609-rc2
        required: true
        type: string
    outputs:
      sha:
        description: Verified commit SHA. Use this for every downstream checkout.
        value: ${{ jobs.guard.outputs.sha }}
      stable_branch:
        description: Release branch derived from the tag, e.g. stable2609.
        value: ${{ jobs.guard.outputs.stable_branch }}

  # Standalone runs, for testing the guard against a tag without a caller.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to verify, e.g. polkadot-stable2609-rc2
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      stable_branch: ${{ steps.verify.outputs.stable_branch }}
    steps:
      - name: Check the caller
        env:
          CALLER_REPO: ${{ github.repository }}
        run: |
          if [[ "$CALLER_REPO" != "paritytech/release-automation" ]]; then
            echo "::error title=Unsupported caller::The release guard must be called from paritytech/release-automation, not ${CALLER_REPO}"
            exit 1
          fi

      # Checks out release-automation itself, NOT the release tag. The guard must
      # never take its own verification logic from the tree it is verifying.
      #
      # github.sha is the caller's commit. The caller check above ensures that is
      # a release-automation commit, and a local `uses: ./` call loads this guard
      # from that same commit, so the helpers match the guard workflow exactly.
      - name: Checkout guard helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: paritytech/release-automation
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the release ref
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASES_ON: ${{ vars.RELEASES_ON }}
        run: ./.github/scripts/guard/verify-release-ref.sh
