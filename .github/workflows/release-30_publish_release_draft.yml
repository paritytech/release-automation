name: Release - Publish draft

# This workflow runs in paritytech-release and creates full release draft with:
# - release notes
# - info about the runtimes
# - attached artifacts:
#   - runtimes
#   - binaries
#   - signatures

on:
  workflow_dispatch:
    inputs:
      weekly_release_tag:
        description: Tag matching the actual release candidate with the format polkadot-weeklyW#-rcX
        required: true
        type: string
      build_run_id:
        description: Run ID of the current release workflow run to be used to download the artifacts
        required: true
        type: string
      runtimes:
        description: Runtimes to be published
        type: string
  workflow_call:
      inputs:
        weekly_release_tag:
          description: Tag matching the actual release candidate with the format polkadot-weeklyW#-rcX
          required: true
          type: string
        build_run_id:
          description: Run ID of the current release workflow run to be used to download the artifacts
          required: true
          type: string
        runtimes:
          description: Runtimes to be published
          type: string


jobs:
  # check-synchronization:
  #   uses: paritytech-release/sync-workflows/.github/workflows/check-synchronization.yml@main
  #   secrets:
  #     fork_writer_app_key: ${{ secrets.UPSTREAM_CONTENT_SYNC_APP_KEY }}

  validate-inputs:
    # needs: [ check-synchronization ]
    # if: needs.check-synchronization.outputs.checks_passed == 'true'
    runs-on: ubuntu-latest
    outputs:
        release_tag: ${{ steps.validate_inputs.outputs.release_tag }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate inputs
        id: validate_inputs
        env:
          WEEKLY_RELEASE_TAG: ${{ inputs.weekly_release_tag }}
        run: |
          . ./.github/scripts/common/lib.sh

          RELEASE_TAG=$(validate_weekly_release_tag $WEEKLY_RELEASE_TAG)
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

  collect-artifacts:
    needs: [ validate-inputs ]
    runs-on: ubuntu-latest
    outputs:
      binaries: ${{ steps.binaries.outputs.matrix }}
      binary_count: ${{ steps.binaries.outputs.count }}
      runtime_count: ${{ steps.runtimes.outputs.count }}

    steps:
      - name: Collect built binaries
        id: binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          REPO: ${{ github.repository }}
        run: |
          # A release may deliberately build only a subset of the binaries, and a single
          # binary can fail without cancelling the rest of the build matrix. Derive the
          # publish matrix from the artifacts that actually exist rather than from a
          # static list, so this stage never tries to download something never built.
          names=$(gh api --paginate \
            "repos/${REPO}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[].name')

          echo "Artifacts present in run ${BUILD_RUN_ID}:"
          echo "$names"

          # Binary artifacts are named "<binary>_<target>"; runtimes ("<chain>-runtime")
          # carry no target suffix and are filtered out here. The endpoint reports every
          # run attempt, so a re-run of one build job lists its artifact twice - dedup,
          # or the same asset gets uploaded twice.
          matrix=$(jq -Rsc '
            [ split("\n")[]
              | select(length > 0)
              | capture("^(?<binary>.+)_(?<target>x86_64-unknown-linux-gnu|aarch64-apple-darwin)$") ]
            | unique
            | { include: . }' <<< "$names")

          count=$(jq '.include | length' <<< "$matrix")

          echo "Publishing ${count} binary artifact(s):"
          jq -r '.include[] | "  - \(.binary) (\(.target))"' <<< "$matrix"

          # A binary built for a target this filter does not know about would be dropped
          # without a trace, so name it instead of silently shipping an incomplete release.
          unknown=$(jq -Rr '
            select(test("_"))
            | select(test("_(x86_64-unknown-linux-gnu|aarch64-apple-darwin)$") | not)' <<< "$names")
          if [[ -n "$unknown" ]]; then
            echo "::warning::Artifacts with an unrecognised target suffix were not published: $(tr '\n' ' ' <<< "$unknown")"
          fi

          if [[ "$count" -eq 0 ]]; then
            echo "::warning::No binary artifacts found in run ${BUILD_RUN_ID}, skipping the binary upload."
          fi

          echo "matrix=${matrix}" >> $GITHUB_OUTPUT
          echo "count=${count}" >> $GITHUB_OUTPUT

      - name: Count runtimes to publish
        id: runtimes
        env:
          RUNTIMES: ${{ inputs.runtimes }}
        run: |
          # find_runtimes returns '{ "include": [] }' when nothing matched (lib.sh), which
          # is a non-empty string that still fails the job as an empty Actions matrix, so
          # the emptiness has to be judged on the include array rather than the string.
          if [[ -z "$RUNTIMES" ]]; then
            count=0
          else
            count=$(jq '.include | length' <<< "$RUNTIMES")
          fi

          echo "Publishing ${count} runtime(s)"
          if [[ "$count" -eq 0 ]]; then
            echo "::warning::No runtimes passed to this release, skipping the runtime upload."
          fi

          echo "count=${count}" >> $GITHUB_OUTPUT

  publish-release-draft:
    runs-on: ubuntu-latest
    environment: release
    needs: [ validate-inputs ]
    outputs:
      release_url: ${{ steps.create-release.outputs.html_url }}
      asset_upload_url: ${{ steps.create-release.outputs.upload_url }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: paritytech/polkadot-sdk
          ref: ${{ inputs.weekly_release_tag }}
          fetch-depth: 0

      # - name: Generate content write token for the release automation
