      #     path: |
      #       scripts/release/context.json
      #       **/*-srtool-digest.json

      - name: Create draft release
        id: create-release
        env:
          # GITHUB_TOKEN: ${{ steps.generate_write_token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.validate-inputs.outputs.release_tag }} \
            --repo ${{ github.repository }} \
            --draft \
            --title "Polkadot ${{ needs.validate-inputs.outputs.release_tag }}" \
            --notes "⚠️ Unstable weekly release for **testing purposes only**.⚠️" \
            --latest=false
            # --notes-file ${{ github.workspace}}/scripts/release/RELEASE_DRAFT.md

  publish-runtimes:
    # if: ${{ inputs.crates_only == false && inputs.no_runtimes == false }}
    if: ${{ needs.collect-artifacts.outputs.runtime_count != '0' }}
    needs: [ validate-inputs, collect-artifacts, publish-release-draft ]
    environment: release
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(inputs.runtimes) }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # - name: Download artifacts
      #   uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0

      # - name: Generate content write token for the release automation
      #   id: generate_write_token
      #   uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
      #   with:
      #       app-id: ${{ vars.POLKADOT_SDK_RELEASE_RW_APP_ID }}
      #       private-key: ${{ secrets.POLKADOT_SDK_RELEASE_RW_APP_KEY }}
      #       owner: paritytech
      #       repositories: polkadot-sdk

      - name: Download runtimes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          CHAIN: ${{ matrix.chain }}
        run: |
          mkdir -p "${{ github.workspace }}/runtimes/"
          gh run download "$BUILD_RUN_ID" --name "${CHAIN}-runtime" --dir "${{ github.workspace }}/runtimes"
          echo "Downloaded artifacts:"
          find "${{ github.workspace }}/runtimes" -type f | head -50

      - name: Get runtime info
        env:
          CHAIN: ${{ matrix.chain }}
          RUNTIMES_DIR: ${{ github.workspace }}/runtimes
        run: |
          # Find the wasm file — search from the download root in case directory nesting varies
          ASSET=$(find "$RUNTIMES_DIR" -name '*.compact.compressed.wasm' -path "*${CHAIN}*" | head -1)
          if [ -z "$ASSET" ]; then
            echo "::error::No compact.compressed.wasm found for ${CHAIN}"
            exit 1
          fi
          echo "ASSET=${ASSET}" >> $GITHUB_ENV

          # Find the srtool digest json
          DIGEST=$(find "$RUNTIMES_DIR" -name "${CHAIN}-srtool-digest.json" | head -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::No srtool digest found for ${CHAIN}"
            exit 1
          fi
          echo "SPEC=$(jq -r .runtimes.compact.subwasm.core_version.specVersion "$DIGEST")" >> $GITHUB_ENV

      - name: Upload compressed ${{ matrix.chain }} v${{ env.SPEC }} wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN: ${{ matrix.chain }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          VERSIONED_ASSET="${CHAIN}_runtime-v${SPEC}.compact.compressed.wasm"
          mv "$ASSET" "$VERSIONED_ASSET"

          gh release upload "$RELEASE_TAG" \
            --repo "$REPO" "$VERSIONED_ASSET"

  publish-release-artifacts:
    # if: ${{ inputs.crates_only == false }}
    if: ${{ needs.collect-artifacts.outputs.binary_count != '0' }}
    needs: [ validate-inputs, collect-artifacts, publish-release-draft ]
    environment: release
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      # One binary failing to upload must not cancel the uploads of the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.collect-artifacts.outputs.binaries) }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # - name: Fetch binaries from s3 based on version
      #   run: |
      #     . ./.github/scripts/common/lib.sh

      #     VERSION="${{ needs.validate-inputs.outputs.release_tag }}"
      #     fetch_release_artifacts_from_s3 ${{ matrix.binary }} ${{ matrix.target }}
      - name: Download artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "release-artifacts/${TARGET}/${BINARY}"
          gh run download "$BUILD_RUN_ID" \
            --name "${BINARY}_${TARGET}" \
            --dir "release-artifacts/${TARGET}/${BINARY}"

      - name: Rename aarch64-apple-darwin binaries
        if: ${{ matrix.target == 'aarch64-apple-darwin' }}
        env:
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        working-directory: ${{ github.workspace}}/release-artifacts/${{ matrix.target }}/${{ matrix.binary }}
        run: |
          . ../../../.github/scripts/common/lib.sh

          mv "$BINARY" "${BINARY}-aarch64-apple-darwin"

          sha256sum "${BINARY}-aarch64-apple-darwin" | tee "${BINARY}-aarch64-apple-darwin.sha256"
          check_sha256 "${BINARY}-aarch64-apple-darwin" && echo "OK" || echo "ERR"

      # - name: Generate content write token for the release automation
      #   id: generate_write_token
      #   uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
      #   with:
      #       app-id: ${{ vars.POLKADOT_SDK_RELEASE_RW_APP_ID }}
      #       private-key: ${{ secrets.POLKADOT_SDK_RELEASE_RW_APP_KEY }}
      #       owner: paritytech
      #       repositories: polkadot-sdk

      - name: Upload ${{ matrix.binary }} binary to release draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          REPO: ${{ github.repository }}
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        working-directory: ${{ github.workspace}}/release-artifacts/${{ matrix.target }}/${{ matrix.binary }}
        run: |
          if [[ "$TARGET" == "aarch64-apple-darwin" ]]; then
            gh release upload "$RELEASE_TAG" \
              --repo "$REPO" \
              "${BINARY}-aarch64-apple-darwin" \
              "${BINARY}-aarch64-apple-darwin.sha256"
          else
            gh release upload "$RELEASE_TAG" \
              --repo "$REPO" \
              "$BINARY" \
              "${BINARY}.sha256"
          fi
