name: Stable Release - Combined Publish Release

# This workflow orchestrates the final release steps by calling workflows in sequence:
# 1. Promote RC to final on S3
# 2. Publish Debian and RPM packages (in parallel)
# 3. Publish Docker images
#
# It runs before the GitHub release is published, so the final tag does not exist
# yet. Every stage therefore verifies the rc tag being promoted (the final tag
# later points at the same commit) and receives it as `source_tag`.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release RC tag in the format polkadot-stableYYMM(-X)-rcX
        type: string
        required: true

      binary:
        description: Binary to be released
        default: all
        type: choice
        required: true
        options:
          - all
          - polkadot
          - polkadot-parachain
          - polkadot-omni-node
          - frame-omni-bencher
          - chain-spec-builder
          - eth-rpc

      registry:
        description: Container registry for Docker images
        required: true
        type: string
        default: docker.io

      owner:
        description: Owner of the container image repo
        required: true
        type: string
        default: parity

      version:
        description: Version for Docker tags in format v1.16.0
        required: true
        type: string

      distribution:
        description: Distribution where to publish rpm package (release, staging)
        default: release
        required: true
        type: string

jobs:

  # Fails fast on a bad tag before anything is promoted. Each called workflow runs
  # the guard again for itself, since each can also be dispatched on its own.
  guard:
    uses: ./.github/workflows/release-guard.yml
    with:
      release_tag: ${{ inputs.release_tag }}

  # ==============================================
  # PHASE 1: Promote RC to Final on S3
  # ==============================================
  promote-rc-to-final:
    name: Promote RC to final on S3
    needs: [guard]
    uses: ./.github/workflows/release-stable-31_promote-rc-to-final.yml
    with:
      binary: ${{ inputs.binary }}
      release_tag: ${{ inputs.release_tag }}

    secrets: inherit

  # ==============================================
  # PHASE 2: Publish Packages (Debian and RPM)
  # ==============================================
  publish-deb-package:
    name: Publish Debian package
    needs: [promote-rc-to-final]
    uses: ./.github/workflows/release-stable-40_publish-deb-package.yml
    with:
      tag: ${{ needs.promote-rc-to-final.outputs.final_tag }}
      source_tag: ${{ inputs.release_tag }}
      distribution: release

    secrets: inherit

  publish-rpm-package:
    name: Publish RPM package
    needs: [promote-rc-to-final]
    uses: ./.github/workflows/release-stable-41_publish-rpm-package.yml
    with:
      tag: ${{ needs.promote-rc-to-final.outputs.final_tag }}
      source_tag: ${{ inputs.release_tag }}
      distribution: ${{ inputs.distribution }}

    secrets: inherit

  # ==============================================
  # PHASE 3: Publish Docker Images
  # ==============================================
  publish-docker-polkadot:
    name: Publish Docker image - polkadot
    needs: [promote-rc-to-final, publish-deb-package]
    if: ${{ inputs.binary == 'polkadot' || inputs.binary == 'all' }}
    uses: ./.github/workflows/release-stable-50_publish-docker.yml
    with:
      image_type: release
      binary: polkadot
      registry: ${{ inputs.registry }}
      owner: ${{ inputs.owner }}
      version: ${{ inputs.version }}
      stable_tag: ${{ needs.promote-rc-to-final.outputs.final_tag }}
      source_tag: ${{ inputs.release_tag }}

    secrets: inherit
    permissions:
      contents: read

  publish-docker-polkadot-parachain:
    name: Publish Docker image - polkadot-parachain
    # needs: [publish-deb-package, publish-rpm-package]
    needs: [promote-rc-to-final]
    if: ${{ inputs.binary == 'polkadot-parachain' || inputs.binary == 'all' }}
    uses: ./.github/workflows/release-stable-50_publish-docker.yml
    with:
      image_type: release
      binary: polkadot-parachain
      registry: ${{ inputs.registry }}
      owner: ${{ inputs.owner }}
      version: ${{ inputs.version }}
      stable_tag: ${{ needs.promote-rc-to-final.outputs.final_tag }}
      source_tag: ${{ inputs.release_tag }}

    secrets: inherit
    permissions:
      contents: read

  publish-docker-polkadot-omni-node:
    name: Publish Docker image - polkadot-omni-node
    # needs: [publish-deb-package, publish-rpm-package]
    needs: [promote-rc-to-final]
    if: ${{ inputs.binary == 'polkadot-omni-node' || inputs.binary == 'all' }}
    uses: ./.github/workflows/release-stable-50_publish-docker.yml
    with:
      image_type: release
      binary: polkadot-omni-node
      registry: ${{ inputs.registry }}
      owner: ${{ inputs.owner }}
      version: ${{ inputs.version }}
      stable_tag: ${{ needs.promote-rc-to-final.outputs.final_tag }}
      source_tag: ${{ inputs.release_tag }}

    secrets: inherit
    permissions:
      contents: read

  publish-docker-chain-spec-builder:
    name: Publish Docker image - chain-spec-builder
    # needs: [publish-deb-package, publish-rpm-package]
    needs: [promote-rc-to-final]
    if: ${{ inputs.binary == 'chain-spec-builder' || inputs.binary == 'all' }}
    uses: ./.github/workflows/release-stable-50_publish-docker.yml
    with:
      image_type: release
      binary: chain-spec-builder
      registry: ${{ inputs.registry }}
      owner: ${{ inputs.owner }}
      version: ${{ inputs.version }}
      stable_tag: ${{ needs.promote-rc-to-final.outputs.final_tag }}
      source_tag: ${{ inputs.release_tag }}

    secrets: inherit
    permissions:
      contents: read

  publish-docker-eth-rpc:
    name: Publish Docker image - eth-rpc
    # needs: [publish-deb-package, publish-rpm-package]
    needs: [promote-rc-to-final]
    if: ${{ inputs.binary == 'eth-rpc' || inputs.binary == 'all' }}
    uses: ./.github/workflows/release-stable-50_publish-docker.yml
    with:
      image_type: release
      binary: eth-rpc
      registry: ${{ inputs.registry }}
      owner: ${{ inputs.owner }}
      version: ${{ inputs.version }}
      stable_tag: ${{ needs.promote-rc-to-final.outputs.final_tag }}
      source_tag: ${{ inputs.release_tag }}

    secrets: inherit
    permissions:
      contents: read
