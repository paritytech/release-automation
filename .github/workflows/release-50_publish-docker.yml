name: Release - Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      # image_type:
      #   description: Type of the image to be published
      #   required: true
      #   default: rc
      #   type: choice
      #   options:
      #     - rc
      #     - release

      binary:
        description: Binary to be published
        required: true
        default: all
        type: choice
        options:
          - all
          - polkadot
          - polkadot-omni-node
          - polkadot-parachain
          - chain-spec-builder
          - eth-rpc

      registry:
        description: Container registry
        required: true
        type: string
        default: docker.io

      # The owner is often the same as the Docker Hub username but does ont have to be.
      # In our case, it is not.
      owner:
        description: Owner of the container image repo
        required: true
        type: string
        default: paritypr

      version:
        description: Version of the polkadot node release in format v1.XX.X-weeklyYYYYw# (e.g. v1.19.0-weekly2025w1)
        default: v1.19.0-weekly2025w1
        required: true

      weekly_release_tag:
        description: Tag matching the actual weekly release version in the format polkadot-weeklyYYYYw#(-rcX) (e.g. polkadot-weekly2025w1-rc1)
        required: true
      build_run_id:
        description: Run ID of the current release workflow run to be used to download the artifacts
        required: true
        type: string

  workflow_call:
    inputs:
      binary:
        description: Binary to be published, or 'all' to publish every image
        required: true
        default: all
        type: string

      registry:
        description: Container registry
        required: true
        type: string
        default: docker.io

      # The owner is often the same as the Docker Hub username but does ont have to be.
      # In our case, it is not.
      owner:
        description: Owner of the container image repo
        required: true
        type: string
        default: paritypr

      version:
        description: Version of the polkadot node release in format v1.XX.X-weeklyYYYYw# (e.g. v1.19.0-weekly2025w1)
        default: v1.19.0-weekly2025w1
        required: true
        type: string

      weekly_release_tag:
        description: Tag matching the actual weekly release version in the format polkadot-weeklyYYYYw#(-rcX) (e.g. polkadot-weekly2025w1-rc1)
        required: true
        type: string
      build_run_id:
        description: Run ID of the current release workflow run to be used to download the artifacts
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  actions: read

env:
  ENGINE: docker
  REGISTRY: ${{ inputs.registry }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOCKER_OWNER: ${{ inputs.owner || github.repository_owner }}
  REPO: ${{ github.repository }}
  BINARY: ${{ inputs.binary }}
  # Single source of truth for the images this workflow publishes: set-up-binaries
  # derives the build matrix from it, and anything not listed here is skipped rather
  # than failed, because the release builds binaries that have no image (subkey and
  # friends). The workflow_dispatch `options:` list above has to be kept in sync by
  # hand - GitHub only accepts literals there.
  DOCKER_IMAGES: '[ "polkadot", "polkadot-parachain", "polkadot-omni-node", "chain-spec-builder", "eth-rpc" ]'
  # IMAGE_TYPE: ${{ inputs.image_type }}

jobs:
  validate-inputs:
    runs-on: parity-default
    outputs:
      version: ${{ steps.validate_inputs.outputs.VERSION }}
      weekly_release_tag: ${{ steps.validate_inputs.outputs.weekly_release_tag }}
      docker_tag: ${{ steps.validate_inputs.outputs.docker_tag }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate inputs
        id: validate_inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_WEEKLY_RELEASE_TAG: ${{ inputs.weekly_release_tag }}
        run: |
          . ./.github/scripts/common/lib.sh

          VERSION=$(filter_version_from_input "$INPUT_VERSION")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

          RELEASE_TAG=$(validate_weekly_release_tag "$INPUT_WEEKLY_RELEASE_TAG")
          echo "weekly_release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

          # The docker tag is derived here rather than in build-container: that job
          # checks out polkadot-sdk, whose lib.sh has no weekly tag helper.
          # Assign before echoing: inside "$( )" the helper's `exit 1` would be masked by
          # echo's own success, writing its error message out as the docker tag.
          DOCKER_TAG=$(prepare_docker_weekly_tag "$RELEASE_TAG")
          echo "docker_tag=${DOCKER_TAG}" >> $GITHUB_OUTPUT

  set-up-binaries:
    runs-on: parity-default
    needs: [ validate-inputs ]
    outputs:
      binaries: ${{ steps.set_up_binaries.outputs.binaries }}
      count: ${{ steps.set_up_binaries.outputs.count }}
    steps:
      - name: Set up binaries matrix
        id: set_up_binaries
        run: |
          # Selecting a binary that has no image (subkey, substrate-node, ...) is normal
          # for a release, so it yields an empty matrix that skips build-container rather
          # than a failure. This is the only place the image list is interpreted.
          if [ "$BINARY" == "all" ]; then
            MATRIX=$(jq -c '.' <<< "$DOCKER_IMAGES")
          else
            MATRIX=$(jq -c --arg b "$BINARY" '[ .[] | select(. == $b) ]' <<< "$DOCKER_IMAGES")
          fi

          COUNT=$(jq 'length' <<< "$MATRIX")

          echo "Publishing ${COUNT} image(s): ${MATRIX}"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No docker image is published for '${BINARY}', skipping the docker stage."
          fi

          echo "binaries=${MATRIX}" >> $GITHUB_OUTPUT
          echo "count=${COUNT}" >> $GITHUB_OUTPUT

  build-container:
    runs-on: parity-default
    if: ${{ needs.set-up-binaries.outputs.count != '0' }}
    needs: [ validate-inputs, set-up-binaries ]
    environment: release
    strategy:
      matrix:
        binary: ${{ fromJson(needs.set-up-binaries.outputs.binaries) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: paritytech/polkadot-sdk
          ref: ${{ needs.validate-inputs.outputs.weekly_release_tag }}
          fetch-depth: 0

      - name: Generate content write token for the release automation
        id: generate_write_token
        uses: actions/create-github-app-token@v2
        with:
            app-id: ${{ vars.RELEASE_AUTOMATION_APP_ID }}
            private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
            owner: paritytech

      - name: Download artifacts
        env:
          GITHUB_TOKEN: ${{ steps.generate_write_token.outputs.token }}
          RUN_ID: ${{ inputs.build_run_id }}
          BINARY: ${{ matrix.binary }}
          DEST: ${{ github.workspace }}/release-artifacts
        run: |
          type -p gh >/dev/null || {
            (type -p wget >/dev/null || (sudo apt update && sudo apt install wget -y)) \
              && sudo mkdir -p -m 755 /etc/apt/keyrings \
              && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
              && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
              && sudo mkdir -p -m 755 /etc/apt/sources.list.d \
              && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
              && sudo apt update \
              && sudo apt install gh -y
          }

          # The binaries this image injects, and the only artifacts this leg downloads:
          # every leg used to pull every linux artifact of the build run. The polkadot
          # image bundles the two workers, which the build stage uploads separately.
          if [[ "$BINARY" == "polkadot" ]]; then
            bins=(polkadot polkadot-prepare-worker polkadot-execute-worker)
          else
            bins=("$BINARY")
          fi

          patterns=()
          for bin in "${bins[@]}"; do
            patterns+=(-p "${bin}_x86_64-unknown-linux-gnu")
          done

          mkdir -p "$DEST"
          gh run download "$RUN_ID" --repo "$REPO" --dir "$DEST" "${patterns[@]}"
          # move all the downloaded files to the root directory
          find "$DEST" -mindepth 2 -type f -print0 | xargs -0 -I{} mv {} "$DEST"/
          # delete all the empty directories
          find "$DEST" -mindepth 1 -type d -empty -delete
          ls -al "$DEST"

          # gh run download only fails when *no* pattern matches, so a partially built
          # set still reaches this point. build-injected.sh runs with `set -e` disabled,
          # so its `cp` of a missing binary would not stop the build either, and the
          # image would be published with a binary silently absent from it.
          missing=()
          for bin in "${bins[@]}"; do
            [[ -f "$DEST/$bin" ]] || missing+=("$bin")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::The ${BINARY} image requires ${bins[*]}, but run ${RUN_ID} has no artifact for: ${missing[*]}"
            exit 1
          fi

          # Consumed by the sha256 check below, so the set is defined in exactly one place.
          echo "IMAGE_BINS=${bins[*]}" >> $GITHUB_ENV

      - name: Check sha256 of the ${{ matrix.binary }} binaries
        working-directory: release-artifacts
        run: |
          . ../.github/scripts/common/lib.sh

          # IMAGE_BINS comes from the download step above. No `|| echo ERR` here: a
          # corrupt binary has to fail the job rather than log and carry on into a
          # published image.
          for bin in $IMAGE_BINS; do
            echo "Checking binary $bin"
            check_sha256 "$bin"
          done

      # - name: Check GPG ${{ env.BINARY }}
      #   # if: ${{ inputs.binary == 'polkadot-parachain' || inputs.binary == 'polkadot' }}
      #   working-directory: release-artifacts
      #   run: |
      #     . ../.github/scripts/common/lib.sh
      #     import_gpg_keys
      #     check_gpg $BINARY

      - name: Fetch weekly rc commit and tag
        working-directory: release-artifacts
        # if: ${{ env.IMAGE_TYPE == 'rc' }}
        id: fetch_rc_refs
        shell: bash
        run: |
          weekly_tag="${{ needs.validate-inputs.outputs.weekly_release_tag }}"

          commit=$(git rev-parse --short HEAD) && \
          echo "commit=${commit}" >> $GITHUB_OUTPUT

          rc_suffix=$(echo $weekly_tag | sed -n 's/.*\(-rc[0-9]\+\)/\1/p')
          echo "release=$(echo ${{ needs.validate-inputs.outputs.version }})$rc_suffix" >> $GITHUB_OUTPUT

          echo "tag=${{ needs.validate-inputs.outputs.docker_tag }}" >> $GITHUB_OUTPUT

      - name: Resolve the ${{ matrix.binary }} image name
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          # In paritypr the polkadot and polkadot-parachain images live in the
          # *-debug repositories, as in polkadot-sdk's release-build-binary.yml; every
          # other image keeps its binary name. build-injected.sh takes IMAGE as an
          # override, and the push and the checks below read it too, so the name is
          # resolved once here.
          image_repo="$BINARY"
          if [[ "$DOCKER_OWNER" == "paritypr" && ( "$BINARY" == "polkadot" || "$BINARY" == "polkadot-parachain" ) ]]; then
            image_repo="${BINARY}-debug"
          fi

          echo "Image: ${REGISTRY}/${DOCKER_OWNER}/${image_repo}"
          echo "IMAGE=${REGISTRY}/${DOCKER_OWNER}/${image_repo}" >> $GITHUB_ENV

      - name: Build Injected Container image for polkadot rc
        if: ${{ matrix.binary == 'polkadot' }}
        env:
          ARTIFACTS_FOLDER: release-artifacts
          IMAGE_NAME: polkadot
          OWNER: ${{ env.DOCKER_OWNER }}
          TAGS: ${{ join(steps.fetch_rc_refs.outputs.*, ',') }}
          BINARY: ${{ matrix.binary }}
        run: |
          ls -al
          echo "Building container for polkadot"
          ./docker/scripts/polkadot/build-injected.sh $ARTIFACTS_FOLDER

      - name: Build Injected Container image for polkadot-omni-node/chain-spec-builder
        if: ${{ matrix.binary == 'polkadot-omni-node' || matrix.binary == 'chain-spec-builder' }}
        env:
          ARTIFACTS_FOLDER: release-artifacts
          IMAGE_NAME: ${{ matrix.binary }}
          OWNER: ${{ env.DOCKER_OWNER }}
          TAGS: ${{ join(steps.fetch_rc_refs.outputs.*, ',') }}
          BINARY: ${{ matrix.binary }}
        run: |
          ls -al
          echo "Building container for ${{ matrix.binary }}"
          ./docker/scripts/build-injected.sh

      - name: Build Injected Container image for polkadot-parachain
        if: ${{ matrix.binary == 'polkadot-parachain' }}
        env:
          ARTIFACTS_FOLDER: release-artifacts
          IMAGE_NAME: polkadot-parachain
          OWNER: ${{ env.DOCKER_OWNER }}
          DOCKERFILE: docker/dockerfiles/polkadot-parachain/polkadot-parachain_injected.Dockerfile
          TAGS: ${{ join(steps.fetch_rc_refs.outputs.*, ',') }}
          BINARY: ${{ matrix.binary }}
        run: |
          ls -al
          ls -al $ARTIFACTS_FOLDER
          mkdir -p $ARTIFACTS_FOLDER/specs
          cp cumulus/parachains/chain-specs/*.json $ARTIFACTS_FOLDER/specs

          echo "Building container for polkadot-parachain"
          ./docker/scripts/build-injected.sh

      - name: Build Injected Container image for eth-rpc
        if: ${{ matrix.binary == 'eth-rpc' }}
        env:
          ARTIFACTS_FOLDER: release-artifacts
          IMAGE_NAME: eth-rpc
          OWNER: ${{ env.DOCKER_OWNER }}
          DOCKERFILE: docker/dockerfiles/eth-rpc/eth-rpc_injected.Dockerfile
          TAGS: ${{ join(steps.fetch_rc_refs.outputs.*, ',') }}
          BINARY: ${{ matrix.binary }}
          # build-injected.sh validates by shelling into the image with /bin/bash, which
          # this image removes along with /usr/bin. The next step validates it instead.
          SKIP_IMAGE_VALIDATION: "true"
        run: |
          ls -al
          echo "Building container for eth-rpc"
          ./docker/scripts/build-injected.sh

      - name: Verify the ${{ matrix.binary }} image was built
        env:
          # IMAGE comes from the "Resolve the image name" step above.
          TAGS: ${{ join(steps.fetch_rc_refs.outputs.*, ',') }}
          BINARY: ${{ matrix.binary }}
        run: |
          # build-injected.sh runs with `set -e` disabled upstream, so a failed
          # `docker build` still exits 0 and the step above goes green. Assert that every
          # tag it was supposed to produce actually exists before logging in and pushing.
          for tag in ${TAGS//,/ }; do
            if ! $ENGINE image inspect "${IMAGE}:${tag}" >/dev/null 2>&1; then
              echo "::error::${IMAGE}:${tag} was not built"
              exit 1
            fi
            echo "OK ${IMAGE}:${tag}"
          done

          # Run the binary once pre-push. This is the validation skipped inside
          # build-injected.sh for eth-rpc, and it catches a broken image before it is
          # published rather than after. chain-spec-builder takes no --version.
          first_tag="${TAGS%%,*}"
          if [[ "$BINARY" == "chain-spec-builder" ]]; then
            $ENGINE run --rm -i "${IMAGE}:${first_tag}"
          else
            $ENGINE run --rm -i "${IMAGE}:${first_tag}" --version
          fi

      - name: Login to Dockerhub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.PARITYPR_DOCKERHUB_USERNAME }}
          password: ${{ secrets.PARITYPR_DOCKERHUB_PASSWORD }}

      - name: Push Container image for ${{ matrix.binary }}
        id: docker_push
        run: |
          $ENGINE images | grep ${{ matrix.binary }}
          $ENGINE push --all-tags "${IMAGE}"

      - name: Check version for the published image for ${{ matrix.binary }}
        env:
          RELEASE_TAG: ${{ steps.fetch_rc_refs.outputs.release }}
        run: |
          echo "Checking tag ${RELEASE_TAG} for image ${IMAGE}"
          if [[ ${{ matrix.binary }} == 'chain-spec-builder' ]]; then
            $ENGINE run -i "${IMAGE}:${RELEASE_TAG}"
          else
            $ENGINE run -i "${IMAGE}:${RELEASE_TAG}" --version
          fi
