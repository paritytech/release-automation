name: Release - Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      # image_type:
      #   description: Type of the image to be published
      #   required: true
      #   default: rc
      #   type: choice
      #   options:
      #     - rc
      #     - release

      binary:
        description: Binary to be published
        required: true
        default: all
        type: choice
        options:
          - all
          - polkadot
          - polkadot-omni-node
          - polkadot-parachain
          - chain-spec-builder
          - eth-rpc

      registry:
        description: Container registry
        required: true
        type: string
        default: docker.io

      # The owner is often the same as the Docker Hub username but does ont have to be.
      # In our case, it is not.
      owner:
        description: Owner of the container image repo
        required: true
        type: string
        default: paritypr

      version:
        description: Version of the polkadot node release in format v1.XX.X-weeklyYYYYw# (e.g. v1.19.0-weekly2025w1)
        default: v1.19.0-weekly2025w1
        required: true

      weekly_release_tag:
        description: Tag matching the actual weekly release version in the format polkadot-weeklyYYYYw#(-rcX) (e.g. polkadot-weekly2025w1-rc1)
        required: true
      build_run_id:
        description: Run ID of the current release workflow run to be used to download the artifacts
        required: true
        type: string

  workflow_call:
    inputs:
      binary:
        description: Binary to be published, or 'all' to publish every image
        required: true
        default: all
        type: string

      registry:
        description: Container registry
        required: true
        type: string
        default: docker.io

      # The owner is often the same as the Docker Hub username but does ont have to be.
      # In our case, it is not.
      owner:
        description: Owner of the container image repo
        required: true
        type: string
        default: paritypr

      version:
        description: Version of the polkadot node release in format v1.XX.X-weeklyYYYYw# (e.g. v1.19.0-weekly2025w1)
        default: v1.19.0-weekly2025w1
        required: true
        type: string

      weekly_release_tag:
        description: Tag matching the actual weekly release version in the format polkadot-weeklyYYYYw#(-rcX) (e.g. polkadot-weekly2025w1-rc1)
        required: true
        type: string
      build_run_id:
        description: Run ID of the current release workflow run to be used to download the artifacts
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  actions: read

env:
  ENGINE: docker
  REGISTRY: ${{ inputs.registry }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOCKER_OWNER: ${{ inputs.owner || github.repository_owner }}
  REPO: ${{ github.repository }}
  BINARY: ${{ inputs.binary }}
  # Single source of truth for the images this workflow publishes: set-up-binaries
  # derives the build matrix from it, and anything not listed here is skipped rather
  # than failed, because the release builds binaries that have no image (subkey and
  # friends). The workflow_dispatch `options:` list above has to be kept in sync by
  # hand - GitHub only accepts literals there.
  DOCKER_IMAGES: '[ "polkadot", "polkadot-parachain", "polkadot-omni-node", "chain-spec-builder", "eth-rpc" ]'
  # Image platform -> build target its binaries come from. A platform is only built
  # when the image's base image is published for it (see "Resolve image platforms").
  PLATFORMS: '{ "amd64": "x86_64-unknown-linux-gnu", "arm64": "aarch64-unknown-linux-gnu" }'
  # IMAGE_TYPE: ${{ inputs.image_type }}

jobs:
  validate-inputs:
    runs-on: parity-default
    outputs:
      version: ${{ steps.validate_inputs.outputs.VERSION }}
      weekly_release_tag: ${{ steps.validate_inputs.outputs.weekly_release_tag }}
      docker_tag: ${{ steps.validate_inputs.outputs.docker_tag }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate inputs
        id: validate_inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_WEEKLY_RELEASE_TAG: ${{ inputs.weekly_release_tag }}
        run: |
          . ./.github/scripts/common/lib.sh

          VERSION=$(filter_version_from_input "$INPUT_VERSION")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

          RELEASE_TAG=$(validate_weekly_release_tag "$INPUT_WEEKLY_RELEASE_TAG")
          echo "weekly_release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

          # The docker tag is derived here rather than in build-container: that job
          # checks out polkadot-sdk, whose lib.sh has no weekly tag helper.
          # Assign before echoing: inside "$( )" the helper's `exit 1` would be masked by
          # echo's own success, writing its error message out as the docker tag.
          DOCKER_TAG=$(prepare_docker_weekly_tag "$RELEASE_TAG")
          echo "docker_tag=${DOCKER_TAG}" >> $GITHUB_OUTPUT

  set-up-binaries:
    runs-on: parity-default
    needs: [ validate-inputs ]
    outputs:
      binaries: ${{ steps.set_up_binaries.outputs.binaries }}
      count: ${{ steps.set_up_binaries.outputs.count }}
    steps:
      - name: Set up binaries matrix
        id: set_up_binaries
        run: |
          # Selecting a binary that has no image (subkey, substrate-node, ...) is normal
          # for a release, so it yields an empty matrix that skips build-container rather
          # than a failure. This is the only place the image list is interpreted.
          if [ "$BINARY" == "all" ]; then
            MATRIX=$(jq -c '.' <<< "$DOCKER_IMAGES")
          else
            MATRIX=$(jq -c --arg b "$BINARY" '[ .[] | select(. == $b) ]' <<< "$DOCKER_IMAGES")
          fi

          COUNT=$(jq 'length' <<< "$MATRIX")

          echo "Publishing ${COUNT} image(s): ${MATRIX}"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No docker image is published for '${BINARY}', skipping the docker stage."
          fi

          echo "binaries=${MATRIX}" >> $GITHUB_OUTPUT
          echo "count=${COUNT}" >> $GITHUB_OUTPUT

  build-container:
    runs-on: parity-default
    if: ${{ needs.set-up-binaries.outputs.count != '0' }}
    needs: [ validate-inputs, set-up-binaries ]
    environment: release
    strategy:
      matrix:
        binary: ${{ fromJson(needs.set-up-binaries.outputs.binaries) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: paritytech/polkadot-sdk
          ref: ${{ needs.validate-inputs.outputs.weekly_release_tag }}
          fetch-depth: 0

      - name: Generate content write token for the release automation
        id: generate_write_token
        uses: actions/create-github-app-token@v2
        with:
            app-id: ${{ vars.RELEASE_AUTOMATION_APP_ID }}
            private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
            owner: paritytech

      - name: Fetch weekly rc commit and tag
        # if: ${{ env.IMAGE_TYPE == 'rc' }}
        id: fetch_rc_refs
        shell: bash
        run: |
          weekly_tag="${{ needs.validate-inputs.outputs.weekly_release_tag }}"

          commit=$(git rev-parse --short HEAD) && \
          echo "commit=${commit}" >> $GITHUB_OUTPUT

          rc_suffix=$(echo $weekly_tag | sed -n 's/.*\(-rc[0-9]\+\)/\1/p')
          echo "release=$(echo ${{ needs.validate-inputs.outputs.version }})$rc_suffix" >> $GITHUB_OUTPUT

          echo "tag=${{ needs.validate-inputs.outputs.docker_tag }}" >> $GITHUB_OUTPUT

      - name: Resolve the ${{ matrix.binary }} image name
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          # In paritypr the polkadot and polkadot-parachain images live in the
          # *-debug repositories, as in polkadot-sdk's release-build-binary.yml; every
          # other image keeps its binary name. build-injected.sh takes IMAGE as an
          # override, and the push and the checks below read it too, so the name is
          # resolved once here.
          image_repo="$BINARY"
          if [[ "$DOCKER_OWNER" == "paritypr" && ( "$BINARY" == "polkadot" || "$BINARY" == "polkadot-parachain" ) ]]; then
            image_repo="${BINARY}-debug"
          fi

          echo "Image: ${REGISTRY}/${DOCKER_OWNER}/${image_repo}"
          echo "IMAGE=${REGISTRY}/${DOCKER_OWNER}/${image_repo}" >> $GITHUB_ENV

      - name: Resolve the ${{ matrix.binary }} build settings
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          # build-injected.sh reads DOCKERFILE and SKIP_IMAGE_VALIDATION from the
          # environment. The polkadot wrapper exports the same DOCKERFILE itself; it is
          # set here too so the platform check below can read it.
          case "$BINARY" in
            polkadot)
              echo "BUILD_SCRIPT=./docker/scripts/polkadot/build-injected.sh" >> $GITHUB_ENV
              echo "DOCKERFILE=docker/dockerfiles/polkadot/polkadot_injected.Dockerfile" >> $GITHUB_ENV
              ;;
            polkadot-parachain)
              echo "DOCKERFILE=docker/dockerfiles/polkadot-parachain/polkadot-parachain_injected.Dockerfile" >> $GITHUB_ENV
              ;;
            eth-rpc)
              echo "DOCKERFILE=docker/dockerfiles/eth-rpc/eth-rpc_injected.Dockerfile" >> $GITHUB_ENV
              # build-injected.sh validates by shelling into the image with /bin/bash, which
              # this image removes along with /usr/bin. The verify step below covers it.
              echo "SKIP_IMAGE_VALIDATION=true" >> $GITHUB_ENV
              ;;
            *)
              echo "DOCKERFILE=docker/dockerfiles/binary_injected.Dockerfile" >> $GITHUB_ENV
              ;;
          esac

      - name: Set up buildx
        # The platform check and the manifest lists need the buildx plugin. The docker
        # driver keeps the built images in the daemon, where build-injected.sh and the
        # verify step expect them.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Resolve image platforms
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          # An image can only be built for the platforms its base image is published
          # for. A missing platform is dropped with a warning rather than failing the
          # release. The injected Dockerfiles are single-stage, so the first FROM is the
          # base image (skipping flags such as --platform); a single-manifest base image
          # carries no platform list and is amd64.
          base_image=$(awk 'toupper($1) == "FROM" { for (i = 2; i <= NF; i++) if ($i !~ /^--/) { print $i; exit } }' "$DOCKERFILE")
          base_archs=$($ENGINE buildx imagetools inspect --raw "$base_image" \
            | jq -r '[.manifests[]?.platform.architecture] | if length == 0 then ["amd64"] else . end | .[]')
          echo "${base_image} is published for: $(tr '\n' ' ' <<< "$base_archs")"

          archs=()
          for arch in $(jq -r 'keys[]' <<< "$PLATFORMS"); do
            if grep -qx "$arch" <<< "$base_archs"; then
              archs+=("$arch")
            else
              echo "::warning::${base_image} has no linux/${arch} variant, the ${arch} image of ${BINARY} is not published."
            fi
          done

          if [[ ${#archs[@]} -eq 0 ]]; then
            echo "::error::${base_image} is published for none of the platforms in PLATFORMS"
            exit 1
          fi

          echo "Building ${IMAGE} for: ${archs[*]}"
          echo "ARCHS=${archs[*]}" >> $GITHUB_ENV

      - name: Set up QEMU
        # Runs the arm64 image steps and smoke tests on this amd64 runner.
        if: ${{ contains(env.ARCHS, 'arm64') }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Download artifacts
        env:
          GITHUB_TOKEN: ${{ steps.generate_write_token.outputs.token }}
          RUN_ID: ${{ inputs.build_run_id }}
          BINARY: ${{ matrix.binary }}
          DEST: ${{ github.workspace }}/release-artifacts
        run: |
          type -p gh >/dev/null || {
            (type -p wget >/dev/null || (sudo apt update && sudo apt install wget -y)) \
              && sudo mkdir -p -m 755 /etc/apt/keyrings \
              && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
              && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
              && sudo mkdir -p -m 755 /etc/apt/sources.list.d \
              && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
              && sudo apt update \
              && sudo apt install gh -y
          }

          # The binaries this image injects, and the only artifacts this leg downloads.
          # The polkadot image bundles the two workers, which the build stage uploads
          # separately.
          if [[ "$BINARY" == "polkadot" ]]; then
            bins=(polkadot polkadot-prepare-worker polkadot-execute-worker)
          else
            bins=("$BINARY")
          fi

          # One folder per platform: the binaries carry the same file name for every
          # target, and build-injected.sh takes a single artifacts folder.
          patterns=()
          for arch in $ARCHS; do
            target=$(jq -r --arg a "$arch" '.[$a]' <<< "$PLATFORMS")
            for bin in "${bins[@]}"; do
              patterns+=(-p "${bin}_${target}")
            done
          done

          mkdir -p "$DEST"
          gh run download "$RUN_ID" --repo "$REPO" --dir "$DEST" "${patterns[@]}"

          # gh run download only fails when *no* pattern matches, so a partially built
          # set still reaches this point. build-injected.sh runs with `set -e` disabled,
          # so its `cp` of a missing binary would not stop the build either, and the
          # image would be published with a binary silently absent from it.
          missing=()
          for arch in $ARCHS; do
            target=$(jq -r --arg a "$arch" '.[$a]' <<< "$PLATFORMS")
            mkdir -p "$DEST/$arch"
            for bin in "${bins[@]}"; do
              if [[ -d "$DEST/${bin}_${target}" ]]; then
                mv "$DEST/${bin}_${target}"/* "$DEST/$arch/"
                rmdir "$DEST/${bin}_${target}"
              fi
              [[ -f "$DEST/$arch/$bin" ]] || missing+=("${bin}_${target}")
            done
          done

          if [[ "$BINARY" == "polkadot-parachain" ]]; then
            for arch in $ARCHS; do
              mkdir -p "$DEST/$arch/specs"
              cp cumulus/parachains/chain-specs/*.json "$DEST/$arch/specs"
            done
          fi
          ls -alR "$DEST"

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::The ${BINARY} image requires ${bins[*]} for every platform, but run ${RUN_ID} has no artifact for: ${missing[*]}"
            exit 1
          fi

          # Consumed by the sha256 check below, so the set is defined in exactly one place.
          echo "IMAGE_BINS=${bins[*]}" >> $GITHUB_ENV

      - name: Check sha256 of the ${{ matrix.binary }} binaries
        working-directory: release-artifacts
        run: |
          . ../.github/scripts/common/lib.sh

          # IMAGE_BINS comes from the download step above. No `|| echo ERR` here: a
          # corrupt binary has to fail the job rather than log and carry on into a
          # published image.
          for arch in $ARCHS; do
            pushd "$arch" > /dev/null
            for bin in $IMAGE_BINS; do
              echo "Checking binary $arch/$bin"
              check_sha256 "$bin"
            done
            popd > /dev/null
          done

      # - name: Check GPG ${{ env.BINARY }}
      #   # if: ${{ inputs.binary == 'polkadot-parachain' || inputs.binary == 'polkadot' }}
      #   working-directory: release-artifacts
      #   run: |
      #     . ../.github/scripts/common/lib.sh
      #     import_gpg_keys
      #     check_gpg $BINARY

      - name: Build Injected Container images for ${{ matrix.binary }}
        env:
          TAGS: ${{ join(steps.fetch_rc_refs.outputs.*, ',') }}
          BINARY: ${{ matrix.binary }}
        run: |
          ls -al
          # One single-platform image per arch, tagged with an arch suffix; the push
          # step stitches them into multi-platform tags. DOCKER_DEFAULT_PLATFORM is
          # honoured by the build and by the smoke test inside build-injected.sh.
          IFS=',' read -r -a tags <<< "$TAGS"
          for arch in $ARCHS; do
            arch_tags=$(printf "%s-${arch}," "${tags[@]}")
            echo "Building ${IMAGE} for linux/${arch} with tags ${arch_tags%,}"
            DOCKER_DEFAULT_PLATFORM="linux/${arch}" \
            ARTIFACTS_FOLDER="release-artifacts/${arch}" \
            TAGS="${arch_tags%,}" \
              ${BUILD_SCRIPT:-./docker/scripts/build-injected.sh} "release-artifacts/${arch}"
          done

      - name: Verify the ${{ matrix.binary }} images were built
        env:
          # IMAGE comes from the "Resolve the image name" step above.
          TAGS: ${{ join(steps.fetch_rc_refs.outputs.*, ',') }}
          BINARY: ${{ matrix.binary }}
        run: |
          # build-injected.sh runs with `set -e` disabled upstream, so a failed
          # `docker build` still exits 0 and the step above goes green. Assert that every
          # tag it was supposed to produce exists, for the platform it was meant for,
          # before logging in and pushing.
          for arch in $ARCHS; do
            for tag in ${TAGS//,/ }; do
              built=$($ENGINE image inspect --format '{{.Architecture}}' "${IMAGE}:${tag}-${arch}" 2>/dev/null || true)
              if [[ "$built" != "$arch" ]]; then
                echo "::error::${IMAGE}:${tag}-${arch} was not built for ${arch} (got '${built}')"
                exit 1
              fi
              echo "OK ${IMAGE}:${tag}-${arch}"
            done

            # Run the binary once pre-push. This is the validation skipped inside
            # build-injected.sh for eth-rpc, and it catches a broken image before it is
            # published rather than after. chain-spec-builder takes no --version.
            first_tag="${TAGS%%,*}-${arch}"
            if [[ "$BINARY" == "chain-spec-builder" ]]; then
              $ENGINE run --rm -i --platform "linux/${arch}" "${IMAGE}:${first_tag}"
            else
              $ENGINE run --rm -i --platform "linux/${arch}" "${IMAGE}:${first_tag}" --version
            fi
          done

      - name: Login to Dockerhub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.PARITYPR_DOCKERHUB_USERNAME }}
          password: ${{ secrets.PARITYPR_DOCKERHUB_PASSWORD }}

      - name: Push Container images for ${{ matrix.binary }}
        id: docker_push
        env:
          TAGS: ${{ join(steps.fetch_rc_refs.outputs.*, ',') }}
        run: |
          $ENGINE images | grep ${{ matrix.binary }}
          # The per-arch tags go first; each plain tag is then a manifest list over
          # them, assembled in the registry by imagetools.
          $ENGINE push --all-tags "${IMAGE}"

          for tag in ${TAGS//,/ }; do
            sources=()
            for arch in $ARCHS; do
              sources+=("${IMAGE}:${tag}-${arch}")
            done
            $ENGINE buildx imagetools create --tag "${IMAGE}:${tag}" "${sources[@]}"
          done

      - name: Check version for the published image for ${{ matrix.binary }}
        env:
          RELEASE_TAG: ${{ steps.fetch_rc_refs.outputs.release }}
        run: |
          for arch in $ARCHS; do
            echo "Checking tag ${RELEASE_TAG} for image ${IMAGE} on linux/${arch}"
            if [[ ${{ matrix.binary }} == 'chain-spec-builder' ]]; then
              $ENGINE run --rm -i --pull always --platform "linux/${arch}" "${IMAGE}:${RELEASE_TAG}"
            else
              $ENGINE run --rm -i --pull always --platform "linux/${arch}" "${IMAGE}:${RELEASE_TAG}" --version
            fi
          done
