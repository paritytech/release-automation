# Copies rc artifacts to their final location on S3, using helpers from
# paritytech/polkadot-sdk checked out at the SHA verified by release-guard.
name: Stable Release - Promote rc to final

on:
  workflow_call:
    inputs:
      package:
        description: Package to be promoted
        required: true
        type: string

      release_tag:
        description: Tag matching the actual release candidate with the format polkadot-stableYYMM(-X)-rcX taht will be changed to final in form of polkadot-stableYYMM(-X)
        required: true
        type: string

      final_tag:
        description: Final release tag without RC suffix (e.g., polkadot-stableYYMM)
        required: true
        type: string

      sha:
        description: Commit SHA verified by release-guard. The checkout uses it instead of the tag
        required: true
        type: string

      target:
        description: Target triple for which the artifacts are being uploaded (e.g aarch64-apple-darwin)
        required: true
        type: string

jobs:

  promote-release-artifacts:
    environment: release
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_RELEASE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_RELEASE_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      FINAL_TAG: ${{ inputs.final_tag }}
      PACKAGE: ${{ inputs.package }}
      TARGET: ${{ inputs.target }}

    steps:
      - name: Assert the guard ran
        shell: bash
        env:
          GUARD_SHA: ${{ inputs.sha }}
        run: '[[ "$GUARD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No verified SHA from the release guard"; exit 1; }'

      - name: Checkout polkadot-sdk sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paritytech/polkadot-sdk
          ref: ${{ inputs.sha }}

      # The commit being able to cross-build does not mean this rc was built with
      # arm64: it may predate arm64 support in the pipeline, or its arm64 builds may
      # have failed. Only what the rc actually has on S3 is promoted.
      - name: Check the rc has ${{ inputs.target }} artifacts
        id: present
        run: |
          . ./.github/scripts/common/lib.sh

          if [[ "$TARGET" != "aarch64-unknown-linux-gnu" ]]; then
            echo "promote=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "$PACKAGE" == 'polkadot' ]]; then
            packages=(polkadot polkadot-prepare-worker polkadot-execute-worker)
          else
            packages=("$PACKAGE")
          fi
          missing=()
          for package in "${packages[@]}"; do
            url="$(get_s3_url_base "$package")/${RELEASE_TAG}/${TARGET}/${package}.sha256"
            curl -fsI "$url" > /dev/null || missing+=("$package")
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::warning::${RELEASE_TAG} has no ${TARGET} artifacts for: ${missing[*]}. ${PACKAGE} is promoted without them."
            echo "promote=false" >> $GITHUB_OUTPUT
          else
            echo "promote=true" >> $GITHUB_OUTPUT
          fi

      - name: Fetch binaries from s3 based on version
        if: ${{ steps.present.outputs.promote == 'true' }}
        run: |
          . ./.github/scripts/common/lib.sh

          VERSION="$RELEASE_TAG"
          if [[ "$PACKAGE" == 'polkadot' ]]; then
            packages=(polkadot polkadot-prepare-worker polkadot-execute-worker)
            for package in "${packages[@]}"; do
              OUTPUT_DIR="./release-artifacts/$TARGET/${package}"
              fetch_release_artifacts_from_s3 "$package" "$TARGET"
            done
            NODE_VERSION="$(get_polkadot_node_version_from_code)"

            # The packages are amd64; they must not end up under the arm64 path.
            if [[ "$TARGET" != "aarch64-unknown-linux-gnu" ]]; then
              fetch_debian_package_from_s3 polkadot
              fetch_rpm_package_from_s3 polkadot
            fi
          else
            fetch_release_artifacts_from_s3 "$PACKAGE" "$TARGET"
          fi

      - name: Check sha256 of the fetched binaries
        if: ${{ steps.present.outputs.promote == 'true' }}
        run: |
          . ./.github/scripts/common/lib.sh

          # The fetch keeps going when a file is missing and saves the S3 error page
          # in its place, which must not be promoted as the binary.
          if [[ "$PACKAGE" == 'polkadot' ]]; then
            packages=(polkadot polkadot-prepare-worker polkadot-execute-worker)
          else
            packages=("$PACKAGE")
          fi
          for package in "${packages[@]}"; do
            (cd "./release-artifacts/$TARGET/${package}" && check_sha256 "$package")
          done

      - name: Configure AWS Credentials
        if: ${{ steps.present.outputs.promote == 'true' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload ${{ inputs.package }} ${{ inputs.target }} artifacts to s3
        if: ${{ steps.present.outputs.promote == 'true' }}
        run: |
          . ./.github/scripts/release/release_lib.sh

          if [[ "$PACKAGE" == 'polkadot' ]]; then
            packages=(polkadot polkadot-prepare-worker polkadot-execute-worker)
            for package in "${packages[@]}"; do
              upload_s3_release $package "$FINAL_TAG" "$TARGET"
            done
          else
            upload_s3_release "$PACKAGE" "$FINAL_TAG" "$TARGET"
          fi
