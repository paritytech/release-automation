name: Release - Tag weekly RC
on:
  workflow_dispatch:
    inputs:
      weekly_version:
        description: Current release/rc version in format weeklyW#
  workflow_call:
    inputs:
      weekly_version:
        description: Current release/rc version in format weeklyW#
        type: string
    secrets:
      PGP_KMS_SIGN_COMMITS_KEY:
        required: true
      PGP_KMS_HASH:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_DEFAULT_REGION:
        required: true
      RELEASE_AUTOMATION_APP_PRIVATE_KEY:
      #   required: true
      # RELEASENOTES_MATRIX_V2_ACCESS_TOKEN:
      #   required: true
    outputs:
      rc_tag:
        value: ${{ jobs.tag_rc.outputs.rc_tag }}
jobs:

  validate-inputs:
    runs-on: parity-default
    outputs:
      weekly_version: ${{ steps.validate_inputs.outputs.weekly_version }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@6d193bf28034eafb982f37bd894289fe649468fc # v4.1.7

      - name: Validate inputs
        id: validate_inputs
        run: |
          . ./.github/scripts/common/lib.sh
          weekly_version=$(validate_weekly_release_tag ${{ inputs.weekly_version }})
          echo "weekly_version=${weekly_version}" >> $GITHUB_OUTPUT

  tag_rc:
    needs: [ validate-inputs ]
    runs-on: parity-default
    #container:
     # image: ${{ needs.setup.outputs.IMAGE }}
    strategy:
      matrix:
        channel:
          - name: "RelEng: Polkadot Release Coordination"
            room: '!cqAmzdIcbOFwrdrubV:parity.io'
    environment: release
    env:
      PGP_KMS_KEY: ${{ secrets.PGP_KMS_SIGN_COMMITS_KEY }}
      PGP_KMS_HASH: ${{ secrets.PGP_KMS_HASH }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
    outputs:
      rc_tag: ${{ steps.compute_tag.outputs.new_tag }}

    steps:
      - name: Install python deps and gh
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip python3 gh
      - name: Install pgpkkms
        run: |
          # Install pgpkms that is used to sign commits
          pip install git+https://github.com/paritytech-release/pgpkms.git@e7f806f99e9be5c52f0b4a536b7d4ef9c3e695ed
          sudo ln -s /home/runner/.local/bin/pgpkms-git /usr/local/bin/pgpkms-git
          sudo ln -s /home/runner/.local/bin/pgpkms /usr/local/bin/pgpkms

      - name: Generate content write token for the release automation
        id: generate_write_token
        uses: actions/create-github-app-token@v2
        with:
            app-id: ${{ vars.RELEASE_AUTOMATION_APP_ID }}
            private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
            owner: paritytech

      - name: Checkout sources
        uses: actions/checkout@6d193bf28034eafb982f37bd894289fe649468fc # v4.1.7
        with:
          repository: paritytech/polkadot-sdk
          fetch-depth: 0
          token: ${{ steps.generate_write_token.outputs.token }}
          ref: ${{ needs.validate-inputs.outputs.weekly_version }}

      - name: Import gpg keys
        shell: bash
        run: |
          . ./.github/scripts/common/lib.sh

          import_gpg_keys

      - name: Config git
        run: |
          git config --global commit.gpgsign true
          git config --global gpg.program /usr/local/bin/pgpkms-git
          git config --global user.name "ParityReleases"
          git config --global user.email "release-team@parity.io"
          git config --global user.signingKey "D8018FBB3F534D866A45998293C5FB5F6A367B51"

      - name: Compute next rc tag
        id: compute_tag
        shell: bash

        run: |
          . ./.github/scripts/common/lib.sh

          # Get last rc tag if exists, else set it to {version}-rc1
          version=polkadot-${{ needs.validate-inputs.outputs.weekly_version }}
          echo "$version"
          echo "version=$version" >> $GITHUB_OUTPUT

          last_rc=$(get_latest_rc_tag $version polkadot)

          if [ -n "$last_rc" ]; then
            suffix=$(increment_rc_tag $last_rc)
            echo "new_tag=$version-rc$suffix" >> $GITHUB_OUTPUT
            echo "first_rc=false" >> $GITHUB_OUTPUT
          else
            echo "new_tag=$version-rc1" >> $GITHUB_OUTPUT
            echo "first_rc=true" >> $GITHUB_OUTPUT
          fi

      - name: Apply new tag
        env:
          GH_TOKEN: ${{ steps.generate_write_token.outputs.token }}
          RC_TAG: ${{ steps.compute_tag.outputs.new_tag }}
        run: |
          git tag -s $RC_TAG -m "new rc tag $RC_TAG"
          git push origin $RC_TAG

      # - name: Send Matrix message to ${{ matrix.channel.name }}
      #   uses: s3krit/matrix-message-action@70ad3fb812ee0e45ff8999d6af11cafad11a6ecf # v0.0.3
