name: Stable Release - Prepare or publish final release

# Publishing from the UI makes GitHub create the final tag itself, and that tag
# is lightweight and unsigned. Tagging here puts a `git tag -s` back in the loop.
#
# In prepare mode (the default) this signs and pushes the final tag and moves the
# draft onto it, and stops there: the draft is still reviewed and published with
# one click in the GitHub UI, where GitHub attaches the release to the existing
# signed tag instead of creating one. The legacy polkadot-vX.Y.Z tag and the
# Matrix announcement then follow from the `release: published` event in
# polkadot-sdk. In publish mode the draft is published from here as well.
#
# Re-running after a mid-way failure resumes where the previous run stopped.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag of the rc being released, with the format polkadot-stableYYMM(-X)-rcX
        required: true
        type: string
      mode:
        description: "prepare: sign the final tag and move the draft onto it, to be published from the GitHub UI after review. publish: also publish the draft from here"
        default: prepare
        type: choice
        options:
          - prepare
          - publish
      create_old_release_tag:
        description: Also create the legacy polkadot-vX.Y.Z tag (publish mode only)
        default: true
        type: boolean
      mark_latest:
        description: "Mark as Latest on GitHub (publish mode only). auto: yes when the release line is the newest stable line; true/false: override"
        default: auto
        type: choice
        options:
          - auto
          - "true"
          - "false"

jobs:
  guard:
    uses: ./.github/workflows/release-guard.yml
    with:
      release_tag: ${{ inputs.release_tag }}

  validate-inputs:
    needs: [ guard ]
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate_inputs.outputs.release_tag }}
      final_tag: ${{ steps.validate_inputs.outputs.final_tag }}

    steps:
      - name: Validate inputs
        id: validate_inputs
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # The guard has already validated the tag format; only an rc can be published.
          if [[ ! "$INPUT_RELEASE_TAG" =~ -rc[0-9]+$ ]]; then
            echo "::error::release_tag '${INPUT_RELEASE_TAG}' is not an rc tag"
            exit 1
          fi
          echo "release_tag=${INPUT_RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "final_tag=$(echo ${INPUT_RELEASE_TAG} | sed 's/-rc[0-9]*$//')" >> $GITHUB_OUTPUT

  publish-final-release:
    needs: [ guard, validate-inputs ]
    runs-on: ubuntu-latest
    environment: release
    # Two runs for the same rc would race on the tag push.
    concurrency:
      group: release-stable-32-${{ inputs.release_tag }}
      cancel-in-progress: false
    env:
      PGP_KMS_KEY: ${{ secrets.PGP_KMS_SIGN_COMMITS_KEY }}
      PGP_KMS_HASH: ${{ secrets.PGP_KMS_HASH }}
      # Spares pgpkms-git the key export from KMS, which fails without GPG_KEY_EXPIRATION
      GPG_KEY_FINGERPRINT: ${{ vars.GPG_COMMIT_KEY_FINGERPRINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      RC_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
      FINAL_TAG: ${{ needs.validate-inputs.outputs.final_tag }}
      GUARD_SHA: ${{ needs.guard.outputs.sha }}

    steps:
      - name: Assert the guard ran and the signing key is configured
        shell: bash
        run: |
          [[ "$GUARD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No verified SHA from the release guard"; exit 1; }
          [[ "$GPG_KEY_FINGERPRINT" =~ ^[0-9A-F]{40}$ ]] || { echo "::error::vars.GPG_COMMIT_KEY_FINGERPRINT is not set"; exit 1; }

      - name: Install pgpkms
        run: |
          pip install git+https://github.com/paritytech/pgpkms.git@dc30e487d47f53d069831a4306377a3ec32638ae

      - name: Generate content write token for the release automation
        id: generate_write_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
            client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
            private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
            owner: paritytech
            repositories: polkadot-sdk

      - name: Checkout polkadot-sdk at the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paritytech/polkadot-sdk
          ref: ${{ needs.guard.outputs.sha }}
          token: ${{ steps.generate_write_token.outputs.token }}

      - name: Work out what is left to do
        id: state
        env:
          GH_TOKEN: ${{ steps.generate_write_token.outputs.token }}
        run: |
          set -o pipefail
          # A previous run may have pushed the tag, or moved or published the draft,
          # before failing. Resume from there. polkadot-* tags cannot be moved or
          # deleted afterwards, so a tag anywhere but on the verified commit is fatal.
          # One listing covers drafts and published releases alike, and a failed
          # call fails the step instead of passing for "not found".
          releases=$(gh api --paginate "repos/paritytech/polkadot-sdk/releases?per_page=100" --jq '.[] | "\(.tag_name) \(.draft)"')
          state_of() { local s; s=$(awk -v t="$1" '$1 == t { print $2 }' <<<"$releases"); echo "${s:-missing}"; }
          rc=$(state_of "$RC_TAG")        # true: draft, false: published, missing
          final=$(state_of "$FINAL_TAG")

          # Both patterns are needed: only an annotated tag has a peeled ^{} entry.
          tag_commit=$(git ls-remote --tags origin "refs/tags/${FINAL_TAG}" "refs/tags/${FINAL_TAG}^{}" | tail -n 1 | cut -f1)
          if [[ -n "$tag_commit" && "$tag_commit" != "$GUARD_SHA" ]]; then
            echo "::error::tag ${FINAL_TAG} already exists on ${tag_commit}, not on the verified ${GUARD_SHA}"
            exit 1
          fi

          case "${rc}/${final}" in
            true/missing)    pending=true;  draft_tag=$RC_TAG ;;
            missing/true)    pending=true;  draft_tag=$FINAL_TAG
                             echo "::notice::the draft already carries the tag ${FINAL_TAG}" ;;
            missing/false)   pending=false; draft_tag=
                             echo "::notice::${RC_TAG} is already published as ${FINAL_TAG}" ;;
            false/*)         echo "::error::release ${RC_TAG} is already published, not a draft; the final can only be made from a draft"; exit 1 ;;
            missing/missing) echo "::error::no draft release ${RC_TAG}"; exit 1 ;;
            *)               echo "::error::unexpected state: draft ${RC_TAG}: ${rc}, release ${FINAL_TAG}: ${final}"; exit 1 ;;
          esac

          if [[ -z "$tag_commit" ]]; then
            tag=true
          else
            tag=false
            # Fetch the existing tag so it gets verified exactly like a new one.
            git fetch --no-tags origin "refs/tags/${FINAL_TAG}:refs/tags/${FINAL_TAG}"
          fi

          # The newest published stable release decides whether this one becomes
          # Latest; GitHub's own Latest pointer may have been set by hand.
          newest_stable=""; newest_key=""
          while read -r t d; do
            [[ "$d" == false && "$t" =~ ^polkadot-stable([0-9]{4})(-([0-9]+))?$ ]] || continue
            key=$(printf '%04d%06d' "$((10#${BASH_REMATCH[1]}))" "$((10#${BASH_REMATCH[3]:-0}))")
            if [[ "$key" > "$newest_key" ]]; then newest_stable=$t; newest_key=$key; fi
          done <<<"$releases"

          {
            echo "tag=${tag}"
            echo "pending=${pending}"
            echo "draft_tag=${draft_tag}"
            echo "newest_stable=${newest_stable}"
          } >> "$GITHUB_OUTPUT"
          echo "Left to do: tag=${tag} draft pending=${pending}; newest published stable release: ${newest_stable:-none}"

      - name: Decide whether the release becomes Latest
        id: latest
        if: steps.state.outputs.pending == 'true'
        env:
          MARK_LATEST: ${{ inputs.mark_latest }}
          NEWEST_STABLE: ${{ steps.state.outputs.newest_stable }}
        run: |
          # release-99 in polkadot-sdk announces a release only when it is Latest, and
          # the GitHub UI ticks that by default. In prepare mode this only advises.
          # Prints "YYMM patch" for a stable tag and nothing for anything else.
          stable_version() { [[ "$1" =~ ^polkadot-stable([0-9]{4})(-([0-9]+))?$ ]] && echo "${BASH_REMATCH[1]} ${BASH_REMATCH[3]:-0}"; return 0; }
          if [[ "$MARK_LATEST" == "auto" ]]; then
            read -r new_line new_patch <<<"$(stable_version "$FINAL_TAG")"
            read -r newest_line newest_patch <<<"$(stable_version "$NEWEST_STABLE")"
            if [[ -z "$new_line" ]]; then
              MARK_LATEST=false   # an unstable release is never recommended as Latest
            elif [[ -z "$newest_line" ]]; then
              MARK_LATEST=true    # the first stable release
            elif (( 10#$new_line > 10#$newest_line )) || { (( 10#$new_line == 10#$newest_line )) && (( 10#$new_patch >= 10#$newest_patch )); }; then
              MARK_LATEST=true
            else
              MARK_LATEST=false
            fi
            echo "Newest published stable release: ${NEWEST_STABLE:-none}; ${FINAL_TAG} becomes Latest: ${MARK_LATEST}"
          fi
          echo "mark_latest=${MARK_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Config git
        if: steps.state.outputs.tag == 'true'
        run: |
          git config --global gpg.program /home/runner/.local/bin/pgpkms-git
          git config --global user.name "ParityReleases"
          git config --global user.email "release-team@parity.io"
          git config --global user.signingKey "$GPG_KEY_FINGERPRINT"

      - name: Create the final tag
        if: steps.state.outputs.tag == 'true'
        run: |
          git tag -s "$FINAL_TAG" -m "Polkadot release $FINAL_TAG"

      - name: Verify the final tag
        if: steps.state.outputs.pending == 'true'
        run: |
          # pgpkms-git only signs, so verify with the real gpg, and pin the signer:
          # git's own check would accept any key in the keyring and reject a valid
          # signature once the key's public copy has expired, which is a renewal
          # task for that copy rather than a reason to stop a release.
          gpg --batch --quiet --keyserver hkps://keyserver.ubuntu.com --recv-keys "$GPG_KEY_FINGERPRINT"
          status=$(git -c gpg.program=gpg verify-tag --raw "$FINAL_TAG" 2>&1 || true)
          if ! grep -q "^\[GNUPG:\] VALIDSIG ${GPG_KEY_FINGERPRINT} " <<<"$status"; then
            echo "::error::${FINAL_TAG} is not signed with the release key ${GPG_KEY_FINGERPRINT}"
            printf '%s\n' "$status"
            exit 1
          fi
          if grep -q '^\[GNUPG:\] EXPKEYSIG ' <<<"$status"; then
            echo "::warning::the public copy of ${GPG_KEY_FINGERPRINT} has expired; renew it on the keyserver and on GitHub"
          fi
          echo "${FINAL_TAG} is signed with ${GPG_KEY_FINGERPRINT}"

      - name: Push the final tag
        if: steps.state.outputs.tag == 'true'
        run: |
          git push origin "$FINAL_TAG"

      - name: Move the draft onto the final tag
        if: steps.state.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ steps.generate_write_token.outputs.token }}
          DRAFT_TAG: ${{ steps.state.outputs.draft_tag }}
          MARK_LATEST: ${{ steps.latest.outputs.mark_latest }}
        run: |
          # The tag exists now, so publishing attaches to it instead of making one.
          # Only the tag and title change; the notes stay as reviewed.
          # Release titles read "Polkadot stableYYMM(-X)", without the tag prefix.
          gh release edit "$DRAFT_TAG" \
            --repo paritytech/polkadot-sdk \
            --tag "$FINAL_TAG" \
            --title "Polkadot ${FINAL_TAG#polkadot-}"
          echo "::notice::draft ready to publish at https://github.com/paritytech/polkadot-sdk/releases; set it as the latest release: ${MARK_LATEST}"

      - name: Publish the draft
        if: steps.state.outputs.pending == 'true' && inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ steps.generate_write_token.outputs.token }}
          MARK_LATEST: ${{ steps.latest.outputs.mark_latest }}
        run: |
          gh release edit "$FINAL_TAG" \
            --repo paritytech/polkadot-sdk \
            --draft=false \
            --latest="$MARK_LATEST"

  create-old-release-tag:
    if: ${{ inputs.create_old_release_tag && inputs.mode == 'publish' }}
    needs: [ validate-inputs, publish-final-release ]
    uses: ./.github/workflows/release-stable-60_create-old-release-tag.yml
    with:
      release_tag: ${{ needs.validate-inputs.outputs.final_tag }}
    secrets: inherit
