# Publishes the polkadot deb/rpm package to the package repos, using helpers from
# paritytech/polkadot-sdk checked out at the SHA verified by release-guard.
# Callers run the guard; this workflow only consumes its `sha` output.
name: Stable Release - Reusable - Publish Package

on:
  workflow_call:
    inputs:
      tag:
        description: Current final release tag (e.g., polkadot-stableYYMM)
        required: true
        type: string
      sha:
        description: Commit SHA verified by release-guard. Every checkout uses it instead of the tag
        required: true
        type: string
      source_tag:
        description: Tag the guard verified, if not `tag` itself (the rc tag that `tag` was promoted from)
        required: false
        type: string
      distribution:
        description: Distribution where to publish package (e.g., release, staging)
        required: true
        type: string
      package_type:
        description: Type of package to publish (deb or rpm)
        required: true
        type: string
      aws_repo_base_path:
        description: Base S3 path for package repositories
        type: string
      cloudfront_distribution_id:
        description: CloudFront Distribution ID for cache invalidation
        required: true
        type: string

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
        release_tag: ${{ steps.validate_inputs.outputs.release_tag }}
    steps:
      - name: Validate package type
        if: ${{ inputs.package_type != 'deb' && inputs.package_type != 'rpm' }}
        run: |
          echo "Error: package_type must be either 'deb' or 'rpm'"
          exit 1

      # Inline rather than from lib.sh: `tag` names the S3 path, and when the
      # caller verified `source_tag` instead, the guard never saw it.
      - name: Validate inputs
        id: validate_inputs
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          if [[ ! "$INPUT_TAG" =~ ^polkadot-stable[0-9]{4}(-[0-9]+)?(-rc[0-9]+)?$ ]]; then
            echo "::error::tag '${INPUT_TAG}' must be in the format polkadot-stableYYMM(-X)(-rcX)"
            exit 1
          fi
          if [[ -n "$INPUT_SOURCE_TAG" && "$INPUT_SOURCE_TAG" != "$INPUT_TAG" && "${INPUT_SOURCE_TAG%-rc*}" != "$INPUT_TAG" ]]; then
            echo "::error::source_tag '${INPUT_SOURCE_TAG}' is not an rc of '${INPUT_TAG}'"
            exit 1
          fi
          echo "release_tag=${INPUT_TAG}" >> $GITHUB_OUTPUT

  fetch-artifacts-from-s3:
    runs-on: ubuntu-latest
    needs: [validate-inputs]
    environment: release
    env:
      REPO: paritytech/polkadot-sdk
      VERSION: ${{ needs.validate-inputs.outputs.release_tag }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_RELEASE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_RELEASE_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
    outputs:
      NODE_VERSION: ${{ steps.fetch_artifacts_from_s3.outputs.NODE_VERSION }}
    steps:
      - name: Assert the guard ran
        shell: bash
        env:
          GUARD_SHA: ${{ inputs.sha }}
        run: '[[ "$GUARD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No verified SHA from the release guard"; exit 1; }'

      - name: Checkout polkadot-sdk sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paritytech/polkadot-sdk
          ref: ${{ inputs.sha }}

      - name: Fetch rc artifacts or release artifacts from s3 based on version
        id: fetch_artifacts_from_s3
        env:
          PACKAGE_TYPE: ${{ inputs.package_type }}
        run: |
          . ./.github/scripts/common/lib.sh
          NODE_VERSION="$(get_polkadot_node_version_from_code)"
          echo "NODE_VERSION=${NODE_VERSION}" >> $GITHUB_OUTPUT

          # Fetch specific package type artifact (deb or rpm)
          if [[ "$PACKAGE_TYPE" == "deb" ]]; then
            fetch_debian_package_from_s3 polkadot
          elif [[ "$PACKAGE_TYPE" == "rpm" ]]; then
            fetch_rpm_package_from_s3 polkadot
          fi

      - name: Upload artifacts for later jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ inputs.package_type }}
          path: release-artifacts/polkadot/*.${{ inputs.package_type }}

  publish-package:
    runs-on: ubuntu-latest
    needs: [fetch-artifacts-from-s3]
    environment: release
    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_REPO_PATH: "${{ inputs.aws_repo_base_path }}/${{ inputs.package_type }}"
      LOCAL_REPO_PATH: ${{ github.workspace }}/${{ inputs.package_type }}
      NODE_VERSION: ${{ needs.fetch-artifacts-from-s3.outputs.NODE_VERSION }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip reprepro rpm createrepo-c

          python3 -m pip install --user awscli "pgpkms @ git+https://github.com/paritytech-release/pgpkms.git@dc30e487d47f53d069831a4306377a3ec32638ae"

          # Ensure ~/.local/bin is in PATH right now and for later steps
          export PATH=$HOME/.local/bin:$PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # Export to GITHUB_ENV (this time they won’t be empty)
          echo "PGPKMS_REPREPRO_PATH=$(which pgpkms-reprepro)" >> $GITHUB_ENV
          echo "PGPKMS_RPMSIGN_PATH=$(which pgpkms-rpmsign)" >> $GITHUB_ENV

      - name: Assert the guard ran
        shell: bash
        env:
          GUARD_SHA: ${{ inputs.sha }}
        run: '[[ "$GUARD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No verified SHA from the release guard"; exit 1; }'

      - name: Checkout polkadot-sdk sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paritytech/polkadot-sdk
          ref: ${{ inputs.sha }}

      - name: Download artifacts from previous job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-${{ inputs.package_type }}
          path: release-artifacts

      - name: Setup local deb repo config
        if: ${{ inputs.package_type == 'deb' }}
        run: |
          sed -i "s|^SignWith:.*|SignWith: ! ${PGPKMS_REPREPRO_PATH}|" ${{ github.workspace }}/.github/scripts/release/distributions
          mkdir -p "$LOCAL_REPO_PATH/conf"
          cp ${{ github.workspace }}/.github/scripts/release/distributions "$LOCAL_REPO_PATH/conf/distributions"

      - name: Sync local repo
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_RELEASE_SECRET_ACCESS_KEY }}
          PACKAGE_TYPE: ${{ inputs.package_type }}
        run: |
          # --- Sync Local Repo from S3 ---
          mkdir -p "$LOCAL_REPO_PATH"
          if [[ "$PACKAGE_TYPE" == "deb" ]]; then
            aws s3 sync "$AWS_REPO_PATH/db" "$LOCAL_REPO_PATH/db" || true
            aws s3 sync "$AWS_REPO_PATH/pool" "$LOCAL_REPO_PATH/pool" || true
            aws s3 sync "$AWS_REPO_PATH/dists" "$LOCAL_REPO_PATH/dists" || true
          elif [[ "$PACKAGE_TYPE" == "rpm" ]]; then
            aws s3 sync "$AWS_REPO_PATH" "$LOCAL_REPO_PATH" || true
          fi

      - name: Add packages to local repo, sign, and update metadata
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PGP_KMS_KEY: ${{ secrets.PGP_KMS_KEY }}
          PGP_KMS_HASH: ${{ secrets.PGP_KMS_HASH }}
          PACKAGE_TYPE: ${{ inputs.package_type }}
          DISTRIBUTION: ${{ inputs.distribution }}
        run: |
          . ./.github/scripts/common/lib.sh
          import_gpg_keys

          # --- Add Package to Repo and Sign ---
          if [[ "$PACKAGE_TYPE" == "deb" ]]; then
            debname=$(find release-artifacts/ -name 'polkadot_*.deb' | head -n 1)
            reprepro -b "$LOCAL_REPO_PATH" includedeb "$DISTRIBUTION" "$debname"

          elif [[ "$PACKAGE_TYPE" == "rpm" ]]; then
            rpmname=$(find release-artifacts/ -name 'polkadot-*.rpm' | head -n 1)

            echo "Signing package with pgpkms (via AWS KMS)..."
            chmod +x .github/scripts/release/pgpkms-gpg-wrapper.sh
            cp .github/scripts/release/rpmmacros $HOME/.rpmmacros

            echo "Dumping rpm gpg-related macros..."
            rpm --showrc | grep gpg || true
            echo "Contents of .rpmmacros:"
            cat $HOME/.rpmmacros
            rpm --addsign "$rpmname"

            echo "Copying signed package to local repo..."
            cp "$rpmname" "$LOCAL_REPO_PATH/"

            echo "Updating repository metadata..."
            createrepo_c --update "$LOCAL_REPO_PATH"
          fi

      - name: Upload updated repo to S3
        env:
          AWS_ACCESS_KEY_ID:  ${{ secrets.AWS_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_RELEASE_SECRET_ACCESS_KEY }}
          DISTRIBUTION: ${{ inputs.distribution }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ inputs.cloudfront_distribution_id }}
          PACKAGE_TYPE: ${{ inputs.package_type }}
        run: |
          if [[ "$DISTRIBUTION" == "release" ]]; then
            aws s3 sync "$LOCAL_REPO_PATH" "$AWS_REPO_PATH" --acl public-read
          else
            aws s3 sync "$LOCAL_REPO_PATH" "$AWS_REPO_PATH"
          fi
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/${PACKAGE_TYPE}/*"
