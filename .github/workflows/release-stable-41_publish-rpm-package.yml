name: Stable Release - Publish polkadot RPM package

# This workflow publishes the polkadot RPM package by calling a reusable workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Current final release tag in the format polkadot-stableYYMM or polkadot-stable-YYMM-X
        default: polkadot-stable2412
        required: true
        type: string
      distribution:
        description: Distribution where to publish rpm package (release, staging)
        default: release
        required: true
        type: string
      source_tag:
        description: Tag to verify and check out, if not `tag` itself (e.g. the rc tag, before the final tag exists)
        required: false
        type: string

  workflow_call:
    inputs:
      tag:
        description: Current final release tag in the format polkadot-stableYYMM or polkadot-stable-YYMM-X
        required: true
        type: string
      distribution:
        description: Distribution where to publish rpm package (release, staging)
        default: release
        required: true
        type: string
      source_tag:
        description: Tag to verify and check out, if not `tag` itself (e.g. the rc tag, before the final tag exists)
        required: false
        type: string

jobs:
  # Verifies the tag and pins it to a commit. When called before the GitHub release
  # is published the final tag does not exist yet, so release-70 passes the rc tag
  # it promoted as `source_tag`; it points at the same commit.
  guard:
    uses: ./.github/workflows/release-guard.yml
    with:
      release_tag: ${{ inputs.source_tag || inputs.tag }}

  call-publish-workflow:
    needs: [guard]
    uses: ./.github/workflows/release-stable-reusable-publish-packages.yml
    with:
      tag: ${{ inputs.tag }}
      sha: ${{ needs.guard.outputs.sha }}
      source_tag: ${{ inputs.source_tag }}
      distribution: ${{ inputs.distribution }}
      package_type: 'rpm'
      aws_repo_base_path: ${{ inputs.distribution == 'release' && 's3://releases-package-repos' || 's3://staging-package-repos' }}
      cloudfront_distribution_id: "E36FKEYWDXAZYJ"
    secrets: inherit
