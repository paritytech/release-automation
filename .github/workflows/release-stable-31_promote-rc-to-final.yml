name: Release - Promote RC to final candidate on S3 (stable)

on:
  workflow_dispatch:
    inputs:
      binary:
        description: Binary to be build for the release
        default: all
        type: choice
        options:
          - polkadot
          - polkadot-parachain
          - polkadot-omni-node
          - frame-omni-bencher
          - chain-spec-builder
          - eth-rpc
          - all
      release_tag:
        description: Tag matching the actual release candidate with the format polkadot-stableYYMM(-X)-rcX
        required: true
        type: string

  workflow_call:
    inputs:
      binary:
        description: Binary to be build for the release
        default: all
        type: string
      release_tag:
        description: Tag matching the actual release candidate with the format polkadot-stableYYMM(-X)-rcX
        type: string
        required: true
    outputs:
      final_tag:
        description: "Final release tag without RC suffix (e.g., polkadot-stableYYMM)"
        value: ${{ jobs.validate-inputs.outputs.final_tag }}


jobs:

  # Verifies the rc tag and pins it to a commit. The node version read during
  # promotion comes from that commit; the release fork read it from master.
  guard:
    uses: ./.github/workflows/release-guard.yml
    with:
      release_tag: ${{ inputs.release_tag }}

  validate-inputs:
    needs: [ guard ]
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate_inputs.outputs.release_tag }}
      final_tag: ${{ steps.validate_inputs.outputs.final_tag }}

    steps:
      - name: Validate inputs
        id: validate_inputs
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # The guard has already validated the tag format; only an rc can be promoted.
          if [[ ! "$INPUT_RELEASE_TAG" =~ -rc[0-9]+$ ]]; then
            echo "::error::release_tag '${INPUT_RELEASE_TAG}' is not an rc tag"
            exit 1
          fi
          echo "release_tag=${INPUT_RELEASE_TAG}" >> $GITHUB_OUTPUT

          # Calculate final tag by removing -rc suffix
          FINAL_TAG="$(echo ${INPUT_RELEASE_TAG} | sed 's/-rc[0-9]*$//')"
          echo "final_tag=${FINAL_TAG}" >> $GITHUB_OUTPUT

  promote-polkadot-rc-to-final:
    if: ${{ inputs.binary == 'polkadot' || inputs.binary == 'all' }}
    needs: [ guard, validate-inputs ]
    uses: ./.github/workflows/release-stable-reusable-promote-to-final.yml
    strategy:
      matrix:
        target: [ x86_64-unknown-linux-gnu, aarch64-apple-darwin ]
    with:
      package: polkadot
      release_tag: ${{ needs.validate-inputs.outputs.release_tag }}
      sha: ${{ needs.guard.outputs.sha }}
      final_tag: ${{ needs.validate-inputs.outputs.final_tag }}
      target: ${{ matrix.target }}
    # The AWS secrets are `release` environment secrets, which only the called
    # job (it declares the environment) can read; this calling job cannot.
    secrets: inherit

  promote-polkadot-parachain-rc-to-final:
    if: ${{ inputs.binary == 'polkadot-parachain' || inputs.binary == 'all' }}
    needs: [ guard, validate-inputs ]
    uses: ./.github/workflows/release-stable-reusable-promote-to-final.yml
    strategy:
      matrix:
        target: [ x86_64-unknown-linux-gnu, aarch64-apple-darwin ]
    with:
      package: polkadot-parachain
      release_tag: ${{ needs.validate-inputs.outputs.release_tag }}
      sha: ${{ needs.guard.outputs.sha }}
      final_tag: ${{ needs.validate-inputs.outputs.final_tag }}
      target: ${{ matrix.target }}
    # The AWS secrets are `release` environment secrets, which only the called
    # job (it declares the environment) can read; this calling job cannot.
    secrets: inherit

  promote-polkadot-omni-node-rc-to-final:
    if: ${{ inputs.binary == 'polkadot-omni-node' || inputs.binary == 'all' }}
    needs: [ guard, validate-inputs ]
    uses: ./.github/workflows/release-stable-reusable-promote-to-final.yml
    strategy:
      matrix:
        target: [ x86_64-unknown-linux-gnu, aarch64-apple-darwin ]
    with:
      package: polkadot-omni-node
      release_tag: ${{ needs.validate-inputs.outputs.release_tag }}
      sha: ${{ needs.guard.outputs.sha }}
      final_tag: ${{ needs.validate-inputs.outputs.final_tag }}
      target: ${{ matrix.target }}
    # The AWS secrets are `release` environment secrets, which only the called
    # job (it declares the environment) can read; this calling job cannot.
    secrets: inherit

  promote-frame-omni-bencher-rc-to-final:
    if: ${{ inputs.binary == 'frame-omni-bencher' || inputs.binary == 'all' }}
    needs: [ guard, validate-inputs ]
    uses: ./.github/workflows/release-stable-reusable-promote-to-final.yml
    strategy:
      matrix:
        target: [ x86_64-unknown-linux-gnu, aarch64-apple-darwin ]
    with:
      package: frame-omni-bencher
      release_tag: ${{ needs.validate-inputs.outputs.release_tag }}
      sha: ${{ needs.guard.outputs.sha }}
      final_tag: ${{ needs.validate-inputs.outputs.final_tag }}
      target: ${{ matrix.target }}
    # The AWS secrets are `release` environment secrets, which only the called
    # job (it declares the environment) can read; this calling job cannot.
    secrets: inherit

  promote-chain-spec-builder-rc-to-final:
    if: ${{ inputs.binary == 'chain-spec-builder' || inputs.binary == 'all' }}
    needs: [ guard, validate-inputs ]
    uses: ./.github/workflows/release-stable-reusable-promote-to-final.yml
    strategy:
      matrix:
        target: [ x86_64-unknown-linux-gnu, aarch64-apple-darwin ]
    with:
      package: chain-spec-builder
      release_tag: ${{ needs.validate-inputs.outputs.release_tag }}
      sha: ${{ needs.guard.outputs.sha }}
      final_tag: ${{ needs.validate-inputs.outputs.final_tag }}
      target: ${{ matrix.target }}
    # The AWS secrets are `release` environment secrets, which only the called
    # job (it declares the environment) can read; this calling job cannot.
    secrets: inherit

  promote-eth-rpc-rc-to-final:
    if: ${{ inputs.binary == 'eth-rpc' || inputs.binary == 'all' }}
    needs: [ guard, validate-inputs ]
    uses: ./.github/workflows/release-stable-reusable-promote-to-final.yml
    strategy:
      matrix:
        target: [ x86_64-unknown-linux-gnu, aarch64-apple-darwin ]
    with:
      package: eth-rpc
      release_tag: ${{ needs.validate-inputs.outputs.release_tag }}
      sha: ${{ needs.guard.outputs.sha }}
      final_tag: ${{ needs.validate-inputs.outputs.final_tag }}
      target: ${{ matrix.target }}
    # The AWS secrets are `release` environment secrets, which only the called
    # job (it declares the environment) can read; this calling job cannot.
    secrets: inherit
