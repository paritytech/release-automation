name: Release - Build runtimes

on:
  workflow_dispatch:
    inputs:
      chain:
        description: The chain to use for a build
        default: all
        required: true
        type: choice
        options:
          - all
          - westend
          - asset-hub-westend
          - bridge-hub-westend
          - collectives-westend
          - coretime-westend
          - glutton-westend
          - people-westend
      runtime_dir:
        description: The runtime dir to be used (⚠️ this parameter is optional and needed only in case of the single runtime build, set it accordingly to the runtime you want to build)
        default: polkadot/runtime/westend
        type: choice
        options:
          - polkadot/runtime/westend
          - cumulus/parachains/runtimes/assets/asset-hub-westend
          - cumulus/parachains/runtimes/bridge-hubs/bridge-hub-westend
          - cumulus/parachains/runtimes/collectives/collectives-westend
          - cumulus/parachains/runtimes/coretime/coretime-westend
          - cumulus/parachains/runtimes/glutton/glutton-westend
          - cumulus/parachains/runtimes/people/people-westend

      weekly_release_tag:
        description: Tag matching the actual release candidate with the format polkadot-weeklyW#-rcX
        type: string

  workflow_call:
    inputs:
      chain:
        description: The chain to use for a build
        default: all
        required: true
        type: string
      runtime_dir:
        description: The runtime_dir to be used (this parameter is optional and needed only in case of the single runtime build, set it accordingly to the runtime you want to build)
        default: polkadot/runtime/westend
        type: string
      weekly_release_tag:
        description: Tag matching the actual release candidate with the format polkadot-weeklyW#-rcX
        type: string

jobs:
  validate-inputs:
    runs-on: parity-default
    outputs:
        weekly_release_tag: ${{ steps.validate_inputs.outputs.weekly_release_tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0

      - name: Validate inputs
        id: validate_inputs
        run: |
          . ./.github/scripts/common/lib.sh

          RELEASE_TAG=$(validate_weekly_release_tag ${{ inputs.weekly_release_tag }})
          echo "weekly_release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

  build-runtimes:
    needs: [validate-inputs]
    uses: "./.github/workflows/release-srtool.yml"
    with:
       excluded_runtimes: "asset-hub-rococo bridge-hub-rococo coretime-rococo people-rococo rococo rococo-parachain substrate-test bp cumulus-test kitchensink minimal-template parachain-template penpal polkadot-test seedling shell frame-try sp solochain-template polkadot-sdk-docs-first pallet-staking-async-parachain pallet-staking-async-rc frame-storage-access-test yet-another-parachain revive-dev"
       build_opts: "--features on-chain-release-build"
       profile: production
       chain: ${{ inputs.chain }}
       runtime_dir: ${{ inputs.runtime_dir }}
       weekly_release_tag: ${{ needs.validate-inputs.outputs.weekly_release_tag }}
    permissions:
      id-token: write
      attestations: write
      contents: read

