name: Release - Branch off weekly branch

on:
  workflow_dispatch:
    inputs:
      weekly_version:
        description: The version of the weekly release in the format weeklyYYYYw# that will be used as branch name and rc tag base (e.g. weekly2025w1)
        required: true
        type: string

      node_version:
        description: Version of the polkadot node in the format X.XX.X-weeklyYYYYw# (e.g. 1.15.0-weekly2025w1).
        type: string

      is_new_weekly:
        description: Check this box if this is a new weekly release and the weekly release branch needs to be created
        type: boolean

  workflow_call:
    inputs:
      weekly_version:
        description: The version of the weekly release in the format weeklyYYYYw# that will be used as branch name and rc tag base (e.g. weekly2025w1)
        required: true
        type: string

      node_version:
        description: Version of the polkadot node in the format X.XX.X-weeklyYYYYw# (e.g. 1.15.0-weekly2025w1).
        type: string

      is_new_weekly:
        description: Check this box if this is a new weekly release and the weekly release branch needs to be created
        type: boolean

jobs:
  validate-inputs:
    runs-on: parity-default
    outputs:
      node_version: ${{ steps.validate_inputs.outputs.node_version }}
      weekly_version: ${{ steps.validate_inputs.outputs.weekly_version }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate inputs
        id: validate_inputs
        env:
          INPUT_NODE_VERSION: ${{ inputs.node_version }}
          INPUT_WEEKLY_VERSION: ${{ inputs.weekly_version }}
        run: |
          . ./.github/scripts/common/lib.sh

          if [ -n "$INPUT_NODE_VERSION" ]; then
            node_version=$(filter_version_from_input "$INPUT_NODE_VERSION")
            echo "node_version=${node_version}" >> $GITHUB_OUTPUT
          fi

          weekly_version=$(validate_weekly_release_tag "$INPUT_WEEKLY_VERSION")
          echo "weekly_version=${weekly_version}" >> $GITHUB_OUTPUT

  create-weekly-branch:
    needs: [ validate-inputs ]
    runs-on: parity-default
    environment: release
    env:
      PGP_KMS_KEY: ${{ secrets.PGP_KMS_SIGN_COMMITS_KEY }}
      PGP_KMS_HASH: ${{ secrets.PGP_KMS_HASH }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      WEEKLY_BRANCH_NAME: ${{ needs.validate-inputs.outputs.weekly_version }}

    steps:
      - name: Install python deps and gh
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip python3 gh
      - name: Install pgpkkms
        run: |
          # Install pgpkms that is used to sign commits
          pip install git+https://github.com/paritytech-release/pgpkms.git@e7f806f99e9be5c52f0b4a536b7d4ef9c3e695ed --break-system-packages
          sudo ln -s /home/runner/.local/bin/pgpkms-git /usr/local/bin/pgpkms-git
          sudo ln -s /home/runner/.local/bin/pgpkms /usr/local/bin/pgpkms

      - name: Generate content write token for the release automation
        id: generate_write_token
        uses: actions/create-github-app-token@v2
        with:
            app-id: ${{ vars.RELEASE_AUTOMATION_APP_ID }}
            private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
            owner: paritytech

      - name: Checkout polkadot-sdk sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: paritytech/polkadot-sdk
          token: ${{ steps.generate_write_token.outputs.token }}
          fetch-depth: 0

      - name: Import gpg keys
        run: |
          . ./.github/scripts/common/lib.sh

          import_gpg_keys

      - name: Config git
        run: |
          git config --global commit.gpgsign true
          git config --global gpg.program /usr/local/bin/pgpkms-git
          git config --global user.name "ParityReleases"
          git config --global user.email "release-team@parity.io"
          git config --global user.signingKey "D8018FBB3F534D866A45998293C5FB5F6A367B51"

      - name: Create weekly release branch off master
        shell: bash
        env:
          GH_TOKEN: ${{ steps.generate_write_token.outputs.token }}
        run: |
          echo "🚀 Creating or switching to weekly release branch: $WEEKLY_BRANCH_NAME"

          # Fetch all remote branches
          git fetch origin

          # Check if the weekly branch already exists
          if git rev-parse --verify -q "origin/$WEEKLY_BRANCH_NAME" >/dev/null; then
            echo "✅ Weekly branch '$WEEKLY_BRANCH_NAME' already exists, checking it out"
            # -B so we end up on a real local branch (not detached HEAD), otherwise the
            # follow-up bump/push step has no ref to push.
            git checkout -q -B "$WEEKLY_BRANCH_NAME" "origin/$WEEKLY_BRANCH_NAME"
            git show-ref "$WEEKLY_BRANCH_NAME"
            exit 0
          fi

          # A weekly release is a snapshot of master, so master is always the base.
          #
          # Do NOT branch off the previous weekly branch and merge master in: the weekly
          # branches carry the node/spec_version bump commits, which touch the exact lines
          # master also moves (NODE_VERSION, spec_version in every runtime lib.rs). That
          # merge conflicts by construction and gets worse the longer master runs ahead.
          BASE_BRANCH="master"

          echo "🌿 Creating new branch '$WEEKLY_BRANCH_NAME' from '$BASE_BRANCH'"
          if ! git checkout -q -b "$WEEKLY_BRANCH_NAME" "origin/$BASE_BRANCH"; then
            echo "❌ Failed to create '$WEEKLY_BRANCH_NAME' from '$BASE_BRANCH'"
            exit 1
          fi

          echo "✅ Branched '$WEEKLY_BRANCH_NAME' off $BASE_BRANCH at $(git rev-parse --short HEAD)"

      - name: Bump versions, reorder prdocs and push weekly branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.generate_write_token.outputs.token }}
          IS_NEW_WEEKLY: ${{ inputs.is_new_weekly }}
          NODE_VERSION: ${{ needs.validate-inputs.outputs.node_version }}
        run: |
          . ./.github/scripts/release/release_lib.sh

          if [ "$IS_NEW_WEEKLY" = true ]; then
            NODE_VERSION_PATTERN="\(NODE_VERSION[^=]*= \)\".*\""
            set_version "$NODE_VERSION_PATTERN" $NODE_VERSION "polkadot/node/primitives/src/lib.rs"
            commit_with_message "Bump node version to $NODE_VERSION in polkadot-cli"
            set_version "$NODE_VERSION_PATTERN" $NODE_VERSION "cumulus/polkadot-omni-node/lib/src/nodes/mod.rs"
            commit_with_message "Bump node version to $NODE_VERSION in polkadot-omni-node-lib"

            runtimes_list=$(get_filtered_runtimes_list)

            printf "📋 Bumping spec_version for each runtime\n"

            for f in ${runtimes_list[@]}; do
                printf " 🔄  processing $f\n"

                # Get current spec_version
                current=$(grep -oE 'spec_version:\s*[0-9]+_[0-9]+_[0-9]+' "$f" | grep -oE '[0-9]+_[0-9]+_[0-9]+')
                if [ -z "$current" ]; then
                    echo "  ⚠️  No spec_version found in $f, skipping"
                    continue
                fi

                # Split: 1_021_001 → prefix=1_021, suffix=001
                prefix="${current%_*}"
                suffix="${current##*_}"

                new_suffix=$(printf "%03d" $((10#$suffix + 1)))
                new_version="${prefix}_${new_suffix}"

                sed -i "s/spec_version: ${current}/spec_version: ${new_version}/" "$f"
                echo "✅ Bumped spec_version for $f: ${current} → ${new_version}"
            done

            commit_with_message "Bump spec_version for weekly release"
          fi

          # reorder_prdocs $WEEKLY_BRANCH_NAME

          #VERSION=$(sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*$/\1/' <<< "$NODE_VERSION") #getting reed of the 'v' prefix

          # echo "🔍 Checking if there are any pr_*.prdoc files in the root directory"
          # shopt -s nullglob
          # files=(prdoc/pr_*.prdoc)
          # shopt -u nullglob
          # if [ ${#files[@]} -eq 0 ]; then
          #     echo "No pr_*.prdoc files found, skipping.🤝"
          # else
          #   echo "[+] ℹ️ Reordering prdocs:"
          #   mkdir -p "prdoc/$WEEKLY_BRANCH_NAME"
          #   mv prdoc/pr_*.prdoc prdoc/$WEEKLY_BRANCH_NAME
          #   git add -A
          #   commit_with_message "Reordering prdocs for the release $WEEKLY_BRANCH_NAME"
          # fi

          gh auth setup-git

          # Check if remote branch exists
          if git rev-parse --verify -q origin/"$WEEKLY_BRANCH_NAME" >/dev/null 2>&1; then
            echo "Remote branch '$WEEKLY_BRANCH_NAME' exists, checking for new commits..."
            # Count commits ahead of remote
            COMMITS_AHEAD=$(git rev-list origin/"$WEEKLY_BRANCH_NAME"..HEAD --count 2>/dev/null || echo "0")
            if [ "$COMMITS_AHEAD" -gt 0 ]; then
              echo "Pushing $COMMITS_AHEAD new commits to origin/$WEEKLY_BRANCH_NAME"
              if ! git push origin "$WEEKLY_BRANCH_NAME"; then
                echo "❌ Failed to push to origin/$WEEKLY_BRANCH_NAME"
                exit 1
              fi
            else
              echo "No new commits to push, skipping push."
            fi
          else
            echo "Remote branch '$WEEKLY_BRANCH_NAME' does not exist, pushing new branch"
            if ! git push origin "$WEEKLY_BRANCH_NAME"; then
              echo "❌ Failed to push new branch to origin/$WEEKLY_BRANCH_NAME"
              exit 1
            fi
          fi

          echo "✅ Weekly branch '$WEEKLY_BRANCH_NAME' workflow completed successfully"
